<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>불앤베어 꼬마투자단</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#0f1929; color:#e8edf5; overflow-x:hidden; }
  #app { max-width:900px; margin:0 auto; min-height:100vh; }

  button { font-family:inherit; cursor:pointer; border:none; border-radius:10px; font-weight:700; transition:transform .08s, filter .15s; }
  button:active { transform:scale(.96); }
  button:disabled { opacity:.35; cursor:not-allowed; }

  /* ===== SETUP ===== */
  .setup { padding:40px 24px; text-align:center; }
  .setup .logo { font-size:60px; margin-bottom:8px; }
  .setup h1 { font-size:32px; margin-bottom:6px; color:#ffd23f; }
  .setup .tag { opacity:.7; margin-bottom:30px; font-size:14px; }
  .setup .card { background:#1a2740; border-radius:16px; padding:24px; margin-bottom:16px; text-align:left; }
  .setup .card h3 { font-size:15px; margin-bottom:12px; color:#9fb3d1; }
  .pcount { display:flex; gap:8px; }
  .pcount button { flex:1; padding:14px; background:#243a5e; color:#fff; font-size:16px; }
  .pcount button.sel { background:#ffd23f; color:#16213e; }

  /* preset & advanced options */
  .preset-row { display:flex; flex-direction:column; gap:8px; }
  .preset { background:#243a5e; color:#fff; padding:13px 14px; text-align:left; border:2px solid transparent; border-radius:12px; }
  .preset.sel { background:linear-gradient(135deg,#3d5a8a,#2a3a64); border-color:#ffd23f; }
  .preset .pr-name { font-size:15px; font-weight:800; margin-bottom:2px; }
  .preset .pr-desc { font-size:12px; opacity:.8; }
  .adv-toggle { width:100%; background:none; color:#9fb3d1; padding:10px; margin-top:10px; font-size:13px; }
  .adv-box { display:none; margin-top:10px; background:#0f1929; border-radius:10px; padding:14px; }
  .adv-box.show { display:block; }
  .adv-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; flex-wrap:wrap; }
  .adv-lbl { font-size:12.5px; opacity:.85; min-width:130px; }
  .adv-opts { display:flex; gap:5px; flex-wrap:wrap; flex:1; }
  .adv-opts button { padding:6px 10px; background:#243a5e; color:#fff; font-size:12px; }
  .adv-opts button.sel { background:#ffd23f; color:#16213e; }
  .adv-note { font-size:11.5px; opacity:.6; margin-top:6px; }
  .pname { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .pname input { flex:1; padding:12px 14px; border-radius:10px; border:2px solid #2d4366; background:#0f1929; color:#fff; font-size:15px; }
  .pname input:focus { outline:none; border-color:#ffd23f; }
  .pname .em { font-size:24px; width:34px; text-align:center; }
  .start-btn { width:100%; padding:18px; background:linear-gradient(135deg,#ffd23f,#ffb700); color:#16213e; font-size:20px; margin-top:10px; }
  .rules-toggle { background:none; color:#9fb3d1; text-decoration:underline; font-size:13px; margin-top:18px; padding:8px; }
  .rules-box { background:#1a2740; border-radius:12px; padding:18px; margin-top:14px; text-align:left; font-size:13.5px; line-height:1.7; display:none; }
  .rules-box.show { display:block; }
  .rules-box b { color:#ffd23f; }

  /* learn buttons */
  .learn-row { display:flex; gap:8px; margin-top:14px; }
  .learn-row button { flex:1; padding:14px 6px; background:#1a2740; color:#cfe0f5; font-size:13px; border:1px solid #2d4366; }
  .learn-row button:active { background:#243a5e; }
  .learn-note { font-size:11.5px; opacity:.55; margin-top:10px; }

  /* doc viewer */
  .doc-view { padding:18px 18px 60px; max-width:760px; margin:0 auto; }
  .doc-hdr { display:flex; align-items:center; gap:12px; margin-bottom:16px; position:sticky; top:0; background:#0f1929; padding:10px 0; }
  .doc-hdr h1 { font-size:20px; color:#ffd23f; }
  .back-btn { background:#243a5e; color:#fff; padding:8px 14px; font-size:13px; }
  .doc-body { background:#1a2740; border-radius:14px; padding:20px 22px; text-align:left; line-height:1.7; }
  .doc-body h3 { font-size:15px; color:#7dd3fc; margin:16px 0 5px; }
  .doc-body h3:first-child { margin-top:0; }
  .doc-body p { font-size:14px; opacity:.9; margin-bottom:4px; }
  .doc-body b { color:#ffd23f; }

  /* ===== HEADER ===== */
  .hdr { background:#16213e; padding:10px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(0,0,0,.4); }
  .hdr .round { background:#ffd23f; color:#16213e; padding:4px 12px; border-radius:20px; font-weight:800; font-size:13px; }
  .hdr .phase { font-size:13px; opacity:.8; margin-right:auto; }
  .hdr .menu-btn { background:#243a5e; color:#fff; padding:6px 10px; font-size:12px; }

  /* mini ranking bar */
  .mini-rank { background:#13203a; display:flex; gap:6px; overflow-x:auto; padding:7px 12px; font-size:11px; border-bottom:1px solid #1f3050; position:sticky; top:44px; z-index:49; }
  .mr-item { white-space:nowrap; background:#1a2740; padding:4px 9px; border-radius:14px; opacity:.75; }
  .mr-item b { color:#ffd23f; margin-left:2px; }
  .mr-item.me { opacity:1; border:1px solid #ffd23f; background:#22304d; }

  /* mini event in forecast */
  .mini-ev { display:flex; align-items:center; gap:5px; background:rgba(0,0,0,.25); border-radius:8px; padding:5px 7px; margin-top:5px; text-align:left; }
  .mini-ev .mi-ico { font-size:18px; }
  .mini-ev .mi-tx { font-size:11px; font-weight:700; flex:1; line-height:1.2; }
  .mini-ev .mi-ef { font-size:10.5px; font-weight:800; white-space:nowrap; }
  .mini-ev .mi-ef.up { color:#4ade80; } .mini-ev .mi-ef.down { color:#f87171; }

  /* event reveal pair */
  .ev-pair { display:flex; gap:8px; margin-bottom:14px; }
  .ev-one { flex:1; border-radius:12px; padding:12px 8px; }
  .ev-one.up { background:linear-gradient(135deg,#16331f,#1d4029); border:2px solid #4ade80; }
  .ev-one.down { background:linear-gradient(135deg,#3a1c1c,#4d2424); border:2px solid #f87171; }
  .ev-one.divev { background:linear-gradient(135deg,#332a14,#4a3c1a); border:2px solid #ffd23f; }
  .ev-one.divev .eo-ef { color:#ffd23f; }
  .ev-one .eo-ico { font-size:32px; }
  .ev-one .eo-tx { font-size:13px; font-weight:800; margin:3px 0; line-height:1.25; }
  .ev-one .eo-ef { font-size:12px; font-weight:700; opacity:.9; }

  .rank-row { font-weight:600; }
  .delta { font-size:11px; font-weight:800; margin-left:4px; }
  .delta.up { color:#4ade80; } .delta.down { color:#f87171; }

  /* ===== MARKET ===== */
  .market { padding:12px 14px; }
  .market h2 { font-size:13px; color:#9fb3d1; margin-bottom:8px; padding-left:4px; }
  .stocks { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stock { background:#1a2740; border-radius:12px; padding:10px 8px; text-align:center; position:relative; border:2px solid transparent; }
  .stock .ico { font-size:26px; }
  .stock .nm { font-size:11px; opacity:.8; margin:1px 0; height:14px; }
  .stock .pr { font-size:17px; font-weight:800; }
  .stock .chg { font-size:11px; font-weight:700; height:14px; }
  .stock .chg.up { color:#4ade80; } .stock .chg.down { color:#f87171; }
  .stock .own { font-size:10px; background:#243a5e; border-radius:10px; padding:1px 6px; margin-top:3px; display:inline-block; min-height:14px; }
  .stock.growth { border-color:rgba(248,113,113,.3); }
  .stock.divid { border-color:rgba(74,222,128,.25); }
  .stock .badge { position:absolute; top:4px; right:4px; font-size:9px; opacity:.6; }

  /* ===== FORECAST ===== */
  .forecast { padding:8px 14px; }
  .forecast h2 { font-size:13px; color:#9fb3d1; margin-bottom:8px; padding-left:4px; }
  .fc-cards { display:flex; gap:10px; }
  .fc-cards-1 .fc { flex:1; }
  .fc-cards-3 { flex-wrap:wrap; }
  .fc-cards-3 .fc { flex:1 1 calc(33% - 10px); min-width:130px; }
  .fc { flex:1; border-radius:12px; padding:12px 10px; text-align:center; position:relative; }
  .fc.now { background:linear-gradient(135deg,#3d2020,#5a2828); border:2px solid #f87171; }
  .fc.next { background:linear-gradient(135deg,#1a2a44,#23375a); border:2px solid #60a5fa; }
  .fc.hidden-fc { background:#1a2740; border:2px dashed #4a5d80; }
  .fc .lbl { font-size:10px; font-weight:700; opacity:.8; }
  .fc.now .lbl { color:#f87171; } .fc.next .lbl { color:#60a5fa; }
  .fc .ic { font-size:24px; }
  .fc .tx { font-size:12px; font-weight:700; line-height:1.3; }
  .fc .ef { font-size:12px; margin-top:2px; font-weight:800; }
  .fc .ef.up { color:#4ade80; } .fc .ef.down { color:#f87171; }
  .fc .qm { font-size:32px; opacity:.5; }

  /* ===== PLAYER PANEL ===== */
  .player-panel { padding:10px 14px 14px; }
  .pturn { background:linear-gradient(135deg,#1a2740,#22304d); border-radius:14px; padding:14px; margin-bottom:10px; }
  .pturn .top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .pturn .av { font-size:30px; }
  .pturn .nm { font-size:17px; font-weight:800; }
  .pturn .net { margin-left:auto; text-align:right; }
  .pturn .net .l { font-size:10px; opacity:.6; }
  .pturn .net .v { font-size:18px; font-weight:800; color:#ffd23f; }
  .pturn .stats { display:flex; gap:8px; font-size:12px; }
  .pturn .stat { flex:1; background:#0f1929; border-radius:8px; padding:6px 8px; text-align:center; }
  .pturn .stat .l { opacity:.6; font-size:10px; }
  .pturn .stat .v { font-weight:800; font-size:14px; }

  .actions-left { text-align:center; font-size:12px; opacity:.7; margin-bottom:8px; }
  .actions-left b { color:#ffd23f; font-size:15px; }

  /* trade grid */
  .trade { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:10px; }
  .tcard { background:#1a2740; border-radius:10px; padding:8px 6px; text-align:center; }
  .tcard .ti { font-size:20px; }
  .tcard .tp { font-size:13px; font-weight:800; }
  .tcard .town { font-size:10px; opacity:.6; min-height:13px; }
  .tbtns { display:flex; gap:4px; margin-top:5px; }
  .tbtns button { flex:1; padding:7px 0; font-size:13px; }
  .buy { background:#1971c2; color:#fff; }
  .sell { background:#c2410c; color:#fff; }

  .other-actions { display:flex; gap:8px; }

  /* coach panel */
  .coach-panel { background:#13243f; border:1px solid #2d4366; border-radius:12px; padding:12px; margin-bottom:10px; }
  .coach-head { font-size:12px; font-weight:800; color:#7dd3fc; margin-bottom:8px; }
  .coach-row { font-size:12px; padding:5px 8px; border-radius:8px; margin-bottom:4px; line-height:1.4; }
  .coach-row.buy-row { background:rgba(74,222,128,.12); }
  .coach-row.sell-row { background:rgba(248,113,113,.12); }
  .coach-row b { color:#fff; }
  .cr-tag { font-weight:800; font-size:11px; }
  .buy-row .cr-tag { color:#4ade80; } .sell-row .cr-tag { color:#f87171; }
  .tc-badge { position:absolute; top:3px; left:5px; font-size:14px; }
  .tcard { position:relative; }
  .other-actions button { flex:1; padding:13px; font-size:13px; }
  .act-card { background:#7c3aed; color:#fff; }
  .act-pass { background:#334155; color:#fff; }
  .act-done { background:#059669; color:#fff; }

  /* hand */
  .hand { margin-top:10px; }
  .hand h3 { font-size:12px; color:#9fb3d1; margin-bottom:6px; }
  .hand-cards { display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; }
  .hcard { min-width:130px; background:linear-gradient(135deg,#3b2a5e,#4c357a); border-radius:10px; padding:9px; font-size:11px; }
  .hcard .hi { font-size:20px; text-align:center; }
  .hcard .hn { font-weight:800; text-align:center; font-size:12px; margin:2px 0; }
  .hcard .he { opacity:.85; line-height:1.3; font-size:10.5px; min-height:42px; }
  .hcard button { width:100%; padding:6px; background:#ffd23f; color:#16213e; margin-top:5px; font-size:11px; }

  /* ===== MODAL / TOAST ===== */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; }
  .modal { background:#1a2740; border-radius:18px; padding:24px; max-width:420px; width:100%; text-align:center; border:2px solid #2d4366; }
  .modal .mi { font-size:48px; }
  .modal h2 { font-size:22px; margin:8px 0; }
  .modal p { opacity:.85; margin-bottom:16px; line-height:1.5; font-size:14px; }
  .modal .mbtn { width:100%; padding:15px; background:#ffd23f; color:#16213e; font-size:16px; }
  .modal .mbtn.sec { background:#334155; color:#fff; margin-top:8px; }
  .pass-player { background:linear-gradient(135deg,#16213e,#22304d); }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#16213e; border:2px solid #ffd23f; color:#fff; padding:12px 22px; border-radius:30px; z-index:300; font-size:14px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.5); animation:pop .3s; max-width:88%; text-align:center; }
  @keyframes pop { from{opacity:0; transform:translateX(-50%) translateY(10px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }

  /* event reveal */
  .event-reveal .mi { font-size:56px; }
  .ev-effect { font-size:18px; font-weight:800; margin:10px 0; }
  .ev-detail { background:#0f1929; border-radius:10px; padding:12px; font-size:13px; margin-bottom:16px; text-align:left; }
  .ev-detail .row { display:flex; justify-content:space-between; padding:3px 0; }
  .ev-detail .row .up { color:#4ade80; } .ev-detail .row .down { color:#f87171; }

  /* results */
  .results { padding:20px; }
  .results h1 { text-align:center; font-size:28px; color:#ffd23f; margin-bottom:4px; }
  .results .sub { text-align:center; opacity:.7; margin-bottom:20px; font-size:13px; }
  .rank { background:#1a2740; border-radius:14px; padding:16px; margin-bottom:10px; display:flex; align-items:center; gap:12px; }
  .rank.win { border:2px solid #ffd23f; background:linear-gradient(135deg,#2a2410,#1a2740); }
  .rank .medal { font-size:30px; }
  .rank .info { flex:1; }
  .rank .info .n { font-size:16px; font-weight:800; }
  .rank .info .d { font-size:11px; opacity:.6; }
  .rank .total { font-size:20px; font-weight:800; color:#ffd23f; }
  .breakdown { font-size:11px; opacity:.7; margin-top:3px; }

  .scroll-area { padding-bottom:30px; }
  .hint-tip { background:rgba(255,210,63,.1); border-radius:8px; padding:8px 12px; font-size:12px; margin:8px 14px; color:#ffe27a; }

  /* insights */
  .insights { margin-top:22px; }
  .insights h2 { font-size:16px; color:#ffd23f; margin-bottom:12px; text-align:center; }
  .insight { display:flex; gap:12px; background:#1a2740; border-radius:12px; padding:14px; margin-bottom:9px; text-align:left; }
  .insight .in-ico { font-size:26px; flex-shrink:0; }
  .insight .in-title { font-weight:800; font-size:14px; margin-bottom:3px; color:#e8edf5; }
  .insight .in-text { font-size:12.5px; opacity:.82; line-height:1.5; }

  /* history */
  .stat-box { background:#1a2740; border-radius:12px; padding:16px; margin-bottom:12px; text-align:left; }
  .sb-title { font-weight:800; font-size:14px; margin-bottom:10px; color:#ffd23f; }
  .sb-row { display:flex; justify-content:space-between; padding:5px 0; font-size:14px; border-bottom:1px dashed #2d4366; }
  .sb-row:last-child { border-bottom:none; }
  .sb-row b { color:#ffd23f; }
  .hist-game { background:#0f1929; border-radius:10px; padding:11px; margin-bottom:8px; }
  .hg-head { display:flex; justify-content:space-between; font-size:12px; opacity:.7; margin-bottom:5px; }
  .hg-win { color:#ffd23f; font-weight:700; opacity:1; }
  .hg-players { font-size:12px; line-height:1.5; }
  .hg-ins { font-size:11px; opacity:.6; margin-top:5px; color:#ffe27a; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================================
// 불앤베어 꼬마투자단 - 디지털 플레이 앱 (최종 확정 규칙 기반)
// ============================================================

const COMPANIES = [
  { id:'ice',   ico:'🍦', nm:'아이스크림', type:'growth', start:1000, div:100 },
  { id:'toy',   ico:'🧸', nm:'장난감',     type:'divid',  start:1500, div:250 },
  { id:'game',  ico:'🎮', nm:'게임',       type:'growth', start:2000, div:100 },
  { id:'bakery',ico:'🥐', nm:'빵집',       type:'divid',  start:1000, div:250 },
  { id:'pet',   ico:'🐶', nm:'반려동물',   type:'mid',    start:1500, div:150 },
  { id:'space', ico:'🚀', nm:'우주탐험',   type:'growth', start:2000, div:0 },
];
const PRICE_STEPS = [0,500,1000,1500,2000,2500,3000,3500,4000,4500,5000,5500];
const MAX_PRICE = 5500, MIN_PRICE = 0, MAX_SHARES = 15;

// 이벤트: who(회사id 배열 또는 'all'), steps(+/-), text, chain
const EVENTS = [
  { ico:'☀️', tx:'기록적 폭염!',       who:['ice'],  steps:2, chain:null },
  { ico:'🌧️', tx:'장마가 길어져요',    who:['ice'],  steps:-1, chain:null },
  { ico:'🎄', tx:'크리스마스 대목!',    who:['toy'],  steps:2, chain:null },
  { ico:'🔧', tx:'장난감 리콜 사태',    who:['toy'],  steps:-2, chain:null },
  { ico:'🏆', tx:'게임 신작 대박!',     who:['game'], steps:3, chain:{who:'space',steps:1} },
  { ico:'📵', tx:'게임 서버 장애',      who:['game'], steps:-2, chain:null },
  { ico:'📺', tx:'빵집 방송 맛집!',     who:['bakery'], steps:1, chain:null },
  { ico:'🌾', tx:'밀가루 값 폭등',      who:['bakery'], steps:-1, chain:{who:'ice',steps:-1} },
  { ico:'🐾', tx:'반려문화 확산',       who:['pet'],  steps:2, chain:null },
  { ico:'💉', tx:'사료 회수 사건',      who:['pet'],  steps:-1, chain:null },
  { ico:'🛰️', tx:'위성 발사 성공!',    who:['space'], steps:2, chain:null },
  { ico:'💥', tx:'우주선 발사 실패…',   who:['space'], steps:-2, chain:null },
  { ico:'📈', tx:'경기 호황!',          who:'all',    steps:1, chain:null },
  { ico:'📉', tx:'경기 침체',           who:'all',    steps:-1, chain:null },
  { ico:'🎒', tx:'여름방학 시작',       who:['game'], steps:2, chain:null },
  { ico:'💸', tx:'우주 투자금 고갈',    who:['space'], steps:-1, chain:null },
  { ico:'🎬', tx:'동물 영화 흥행',      who:['pet'],  steps:1, chain:null },
  { ico:'🍧', tx:'아이스크림 신메뉴 히트', who:['ice'], steps:1, chain:null },
  // ===== 배당 이벤트 (주가는 그대로, 배당만 변동 / 한 라운드 적용) =====
  { ico:'🎉', tx:'빵집 풍년! 배당 2배', who:['bakery'], steps:0, divMul:2, kind:'div' },
  { ico:'🎉', tx:'장난감 실적 대박! 배당 2배', who:['toy'], steps:0, divMul:2, kind:'div' },
  { ico:'🎉', tx:'반려가게 호황! 배당 2배', who:['pet'], steps:0, divMul:2, kind:'div' },
  { ico:'📃', tx:'빵집 허리띠 졸라매기, 배당 절반', who:['bakery'], steps:0, divMul:0.5, kind:'div' },

function analyzeAdvice(){
  const advice={};
  COMPANIES.forEach(c=>advice[c.id]={score:0, reasons:[]});
  // flatten all forecast events with their slot index
  const allEvents=[];
  G.forecast.forEach((slot,i)=>slot.forEach(ev=>allEvents.push({ev,slot:i})));
  allEvents.forEach(({ev,slot})=>{
    const when = slot===0 ? '곧' : slot===1 ? '다음 라운드에' : `${slot+1}라운드 뒤에`;
    const targets = ev.who==='all' ? COMPANIES.map(c=>c.id) : ev.who;
    targets.forEach(cid=>{
      const nm=COMPANIES.find(c=>c.id===cid).nm;
      if(ev.kind==='div'){
        if(ev.divMul>1){ advice[cid].score+=1; advice[cid].reasons.push(`${when} ${nm} 배당이 늘어요 (${ev.tx})`); }
        else if(ev.divMul<1){ advice[cid].score-=0.5; advice[cid].reasons.push(`${when} ${nm} 배당이 줄어요`); }
      } else {
        if(ev.steps>0){ advice[cid].score+=ev.steps; advice[cid].reasons.push(`${when} ${nm} 주가가 올라요 (${ev.tx})`); }
        else if(ev.steps<0){ advice[cid].score+=ev.steps; advice[cid].reasons.push(`${when} ${nm} 주가가 내려요 (${ev.tx})`); }
      }
    });
    if(ev.chain && ev.who!=='all'){
      const cid=ev.chain.who; const nm=COMPANIES.find(c=>c.id===cid).nm;
      if(ev.chain.steps>0){ advice[cid].score+=ev.chain.steps; advice[cid].reasons.push(`${when} ${nm} 주가가 함께 올라요 (연동)`); }
      else if(ev.chain.steps<0){ advice[cid].score+=ev.chain.steps; advice[cid].reasons.push(`${when} ${nm} 주가가 함께 내려요 (연동)`); }
    }
  });
  Object.values(advice).forEach(a=>{ a.dir = a.score>0?'buy' : a.score<0?'sell' : null; });
  return advice;
}

const clampPrice = p => Math.max(MIN_PRICE, Math.min(MAX_PRICE, p));
function movePrice(price, steps){
  // move along PRICE_STEPS grid
  let idx = PRICE_STEPS.indexOf(price);
  if(idx<0){ // nearest
    idx = PRICE_STEPS.reduce((best,v,i)=>Math.abs(v-price)<Math.abs(PRICE_STEPS[best]-price)?i:best,0);
  }
  idx = Math.max(0, Math.min(PRICE_STEPS.length-1, idx+steps));
  return PRICE_STEPS[idx];
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
// draw a pair of DISTINCT events (avoid two 'all' or same company clashing too hard)
function drawPair(deck){
  if(deck.length<2) { const fresh=shuffle([...EVENTS,...EVENTS]); while(fresh.length) deck.push(fresh.pop()); }
  const a=deck.pop();
  let b=deck.pop();
  // avoid identical text twice in one round; try one re-draw
  if(b && a && b.tx===a.tx && deck.length){ const c=deck.pop(); deck.push(b); b=c; }
  return [a,b].filter(Boolean);
}
function netWorth(p, prices){
  let stock=0; COMPANIES.forEach(c=>stock+=p.shares[c.id]*prices[c.id]);
  return p.cash + stock;
}
function stockValue(p, prices){ let s=0; COMPANIES.forEach(c=>s+=p.shares[c.id]*prices[c.id]); return s; }

window.startGame = function(){
  saveNames();
  const np = G.setupCount||3;
  const names = G.setupNames || [];
  const opts = G.setupOpts || PRESETS.normal;
  const prices={}; COMPANIES.forEach(c=>prices[c.id]=c.start);
  const goalDeck = shuffle(GOALS);
  const players=[];
  for(let i=0;i<np;i++){
    const shares={}; COMPANIES.forEach(c=>shares[c.id]=0);
    players.push({
      name: names[i]||`P${i+1}`, av:AVATARS[i],
      cash:opts.startCash, shares, goal:goalDeck[i%goalDeck.length],
      hand:[], insured:{}, dividendCount:0, history:[opts.startCash]
    });
  }
  let actionDeck = shuffle([...ACTIONS, ...ACTIONS]);
  players.forEach(p=>{ p.hand=[actionDeck.pop(), actionDeck.pop()]; });
  let eventDeck = shuffle([...EVENTS, ...EVENTS, ...EVENTS]);
  // forecast = array of slots, each slot = pair of events. length = forecastLen
  const forecast = [];
  for(let i=0;i<opts.forecastLen;i++) forecast.push(drawPair(eventDeck));

  G = {
    setupCount:np, setupNames:names, setupOpts:opts,
    players, prices, prevPrices:{...prices}, eventDeck, actionDeck, forecast,
    round:1, turnIdx:0, actionsLeft:ACTIONS_PER_TURN, buyCountThisTurn:{}, maxBuyThisTurn:opts.buyLimit, baseBuyLimit:opts.buyLimit,
    phase:'pass', infoPeek:null, flipNext:false, lastChanges:{},
    coachMode: opts.coachOn,
    log:{ delisted:[], maxConcentration:{}, divTotals:{}, peakStock:{}, trades:0, startTime:Date.now() }
  };
  players.forEach(p=>{ G.log.divTotals[p.name]=0; G.log.maxConcentration[p.name]=0; });
  showPassScreen();
};

// ---------- TRADE ACTIONS ----------
window.buy = function(cid){
  const p=G.players[G.turnIdx]; const pr=G.prices[cid];
  if(G.actionsLeft<=0||pr<=0||p.cash<pr) return;
  const bought=G.buyCountThisTurn[cid]||0;
  if(bought>=G.maxBuyThisTurn){ toast('이번 턴 이 회사는 더 못 사요'); return; }
  if(p.shares[cid]>=MAX_SHARES){ toast('한 회사 최대 15주까지!'); return; }
  p.cash-=pr; p.shares[cid]++; G.buyCountThisTurn[cid]=bought+1;
  // count buy as action only when finishing? -> each buy is part of an action; we treat 1 action = buy phase. Simplify: each buy = 1 action.
  G.actionsLeft--;
  renderTurn();
};
window.sell = function(cid){
  const p=G.players[G.turnIdx]; const pr=G.prices[cid];
  if(G.actionsLeft<=0||p.shares[cid]<=0) return;
  let price=pr;
  if(p.insured[cid]){ // insurance: guarantee buy price -> use max(current, insuredPrice)
    price=Math.max(pr, p.insured[cid]); delete p.insured[cid]; toast('🛡️ 보험 적용! 산 가격 보장');
  }
  p.cash+=price; p.shares[cid]--;
  G.actionsLeft--;
  renderTurn();
};

window.doPass = function(){
  const p=G.players[G.turnIdx];
  if(G.actionsLeft<=0) return;
  p.cash+=500; G.actionsLeft--;
  toast('💰 +500원');
  renderTurn();
};

window.drawCard = function(){
  const p=G.players[G.turnIdx];
  if(G.actionsLeft<=0) return;
  if(!G.actionDeck.length) G.actionDeck=shuffle([...ACTIONS,...ACTIONS]);
  p.hand.push(G.actionDeck.pop());
  G.actionsLeft--;
  toast('🎴 카드를 뽑았어요');
  renderTurn();
};

// ---------- ACTION CARDS ----------
window.useCard = function(i){
  const p=G.players[G.turnIdx]; const card=p.hand[i];
  if(!card) return;
  if(card.id!=='extra' && G.actionsLeft<=0) return;

  switch(card.id){
    case 'extra':
      G.actionsLeft++; p.hand.splice(i,1); toast('⚡ 행동 +1!'); renderTurn(); return;
    case 'cash':
      p.cash+=3000; G.maxBuyThisTurn=5; p.hand.splice(i,1); G.actionsLeft--;
      toast('💰 +3,000원 · 5주 매수 가능!'); renderTurn(); return;
    case 'div': {
      let total=0; COMPANIES.forEach(c=>total+=p.shares[c.id]*100);
      p.cash+=total; p.hand.splice(i,1); G.actionsLeft--;
      toast(`🎁 특별배당 +${won(total)}`); renderTurn(); return;
    }
    case 'flip':
      G.flipNext=true; p.hand.splice(i,1); G.actionsLeft--;
      toast('🔁 이번 이벤트 효과가 반대로!'); renderTurn(); return;
    case 'info': {
      // peek the card after next (3rd) - we peek eventDeck top
      const peek = G.eventDeck[G.eventDeck.length-1];
      G.infoPeek = peek ? (peek.who==='all'?'모든 회사':peek.who.map(id=>COMPANIES.find(c=>c.id===id).nm).join('·')) : '알 수 없음';
      p.hand.splice(i,1); G.actionsLeft--; renderTurn(); return;
    }
    case 'cut':
      chooseStock('손절매 — 어느 회사를 전부 팔까요?', (cid)=>{
        const pr=G.prices[cid]; const n=p.shares[cid];
        if(n<=0){ toast('가진 주식이 없어요'); return; }
        p.cash+=pr*n; p.shares[cid]=0; p.hand.splice(i,1); G.actionsLeft--;
        toast(`✂️ ${COMPANIES.find(c=>c.id===cid).nm} ${n}주 매도`); renderTurn();
      }, (cid)=>p.shares[cid]>0); return;
    case 'avg':
      chooseStock('물타기 — 어느 회사를 싸게 살까요?', (cid)=>{
        const pr=Math.max(0,G.prices[cid]-200);
        if(p.cash<pr){ toast('현금이 부족해요'); return; }
        if(p.shares[cid]>=MAX_SHARES){ toast('15주 상한!'); return; }
        p.cash-=pr; p.shares[cid]++; p.hand.splice(i,1); G.actionsLeft--;
        toast(`💧 ${COMPANIES.find(c=>c.id===cid).nm} 200원 싸게 매수`); renderTurn();
      }, (cid)=>p.shares[cid]>0); return;
    case 'ins':
      chooseStock('보험가입 — 어느 회사 주식을 보호할까요?', (cid)=>{
        if(p.shares[cid]<=0){ toast('가진 주식이 없어요'); return; }
        p.insured[cid]=G.prices[cid]; p.hand.splice(i,1); G.actionsLeft--;
        toast(`🛡️ ${COMPANIES.find(c=>c.id===cid).nm} 보험 가입 (${won(G.prices[cid])} 보장)`); renderTurn();
      }, (cid)=>p.shares[cid]>0); return;
  }
};

// ---------- RESOLVE ROUND (execute BOTH forecast events, dividends, advance) ----------
function resolveRound(){
  const events=G.forecast[0]; // array of up to 2 events
  G.prevPrices={...G.prices};
  const changes=[];
  const flip = G.flipNext; G.flipNext=false;

  // dividend multipliers for THIS round (default 1)
  const divMul={}; COMPANIES.forEach(c=>divMul[c.id]=1);
  const divEvents=[];

  events.forEach(ev=>{
    if(ev.kind==='div'){
      // dividend event: no price move, set multiplier
      const targets = ev.who==='all' ? COMPANIES.map(c=>c.id) : ev.who;
      targets.forEach(cid=>{ divMul[cid] = ev.divMul; });
      divEvents.push(ev);
      return;
    }
    let steps = flip ? -ev.steps : ev.steps;
    const applyTo = ev.who==='all' ? COMPANIES.map(c=>c.id) : ev.who;
    applyTo.forEach(cid=>{
      if(G.prices[cid]<=0) return;
      const before=G.prices[cid];
      G.prices[cid]=movePrice(G.prices[cid], steps);
      changes.push({cid, before, after:G.prices[cid], evIco:ev.ico, evTx:ev.tx});
    });
    if(ev.chain && ev.who!=='all'){
      const cid=ev.chain.who; let cs=flip?-ev.chain.steps:ev.chain.steps;
      if(G.prices[cid]>0){
        const before=G.prices[cid];
        G.prices[cid]=movePrice(G.prices[cid], cs);
        changes.push({cid, before, after:G.prices[cid], chain:true, evIco:ev.ico, evTx:ev.tx});
      }
    }
  });

  // dividends (with this round's multipliers) — only on divEvery rounds
  const divPaid=[];
  const divThisRound = (G.round % G.setupOpts.divEvery === 0);
  G.players.forEach(p=>{
    let total=0;
    if(divThisRound){
      COMPANIES.forEach(c=>{ if(p.shares[c.id]>0 && c.div>0 && G.prices[c.id]>0){ total+=Math.round(p.shares[c.id]*c.div*divMul[c.id]); } });
    }
    if(total>0){ p.cash+=total; p.dividendCount++; G.log.divTotals[p.name]+=total; }
    divPaid.push({name:p.name, av:p.av, amount:total});
  });

  // track delisting + concentration
  changes.forEach(ch=>{
    if(ch.after===0){
      const c=COMPANIES.find(x=>x.id===ch.cid);
      G.players.forEach(p=>{ if(p.shares[ch.cid]>0 && !G.log.delisted.find(d=>d.cid===ch.cid)){ G.log.delisted.push({cid:ch.cid, nm:c.nm, ico:c.ico, victim:p.name}); } });
    }
  });
  G.players.forEach(p=>{
    const maxShare=Math.max(...COMPANIES.map(c=>p.shares[c.id]*G.prices[c.id]));
    const totalStock=stockValue(p,G.prices);
    if(totalStock>0){ const conc=maxShare/totalStock; if(conc>G.log.maxConcentration[p.name]) G.log.maxConcentration[p.name]=conc; }
  });

  // record net worth history
  G.players.forEach(p=> p.history.push(netWorth(p,G.prices)) );

  G.lastChanges={events, flip, changes, divPaid, divEvents};
  showEventReveal();
}

    const nw=p.history[p.history.length-1];

  $('#app').innerHTML = `
    <div class="overlay">
      <div class="modal event-reveal" style="max-width:460px;">
        <div style="font-size:13px;opacity:.7;margin-bottom:6px;">${G.round}라운드 결과</div>

          <div style="font-weight:700;margin-bottom:4px;font-size:12px;">📊 주가 변동</div>
          ${changes.map(ch=>{
            const c=COMPANIES.find(x=>x.id===ch.cid);
            const diff=ch.after-ch.before;
            return `<div class="row"><span>${c.ico} ${c.nm}${ch.chain?' (연동)':''}</span>
              <span class="${diff>=0?'up':'down'}">${won(ch.before)} → ${won(ch.after)}${ch.after===0?' 💀':''}</span></div>`;
          }).join('')}
        </div>`:''}

        ${divEvents&&divEvents.length?`<div class="ev-detail" style="border:1px solid #ffd23f;">
          <div style="font-weight:700;margin-bottom:4px;font-size:12px;color:#ffd23f;">🎁 이번 라운드 배당 변동!</div>
          ${divEvents.map(ev=>{
            const who = ev.who==='all'?'모든 회사':ev.who.map(id=>COMPANIES.find(c=>c.id===id).nm).join('·');
            const label = ev.divMul===0?'이번 배당 없음 🚫':ev.divMul<1?`배당 ${ev.divMul}배로 줄어요`:`배당 ${ev.divMul}배로 늘어요!`;
            return `<div class="row"><span>${ev.ico} ${who}</span><span class="${ev.divMul>=1?'up':'down'}">${label}</span></div>`;
          }).join('')}

        <div class="ev-detail">
          <div style="font-weight:700;margin-bottom:4px;font-size:12px;">🏆 자산 순위 (지난 라운드 대비)</div>
          ${ranked.map((r,i)=>`<div class="row rank-row">

          ${(G.round % G.setupOpts.divEvery !== 0) ? `<div style="text-align:center;opacity:.6;font-size:12px;padding:4px;">이번 라운드는 배당이 없어요. 다음 배당까지 ${G.setupOpts.divEvery - (G.round % G.setupOpts.divEvery)}라운드 남았어요.</div>` : 
            divPaid.map(d=>`<div class="row"><span>${d.av} ${d.name}</span><span class="${d.amount>0?'up':''}">${d.amount>0?'+'+won(d.amount):'-'}</span></div>`).join('')
          }

      </div>
    </div>`;
}

window.advanceRound = function(){
  if(G.round>=TOTAL_ROUNDS){ showResults(); return; }
  // shift forecast slots forward, draw a new one at the end
  G.forecast.shift();
  G.forecast.push(drawPair(G.eventDeck));
  G.infoPeek=null;
  G.round++;
  G.turnIdx=0;
  showPassScreen();
};

// ---------- INSIGHT GENERATION ----------
function generateInsights(ranked){
  const ins=[];
  const winner=ranked[0];
  const loser=ranked[ranked.length-1];

  // 1. winner strategy
  const wConc=G.log.maxConcentration[winner.p.name]||0;
  if(wConc>=0.7){
    ins.push({ico:'🎯', title:'집중 투자가 통한 판', text:`${winner.p.name}님은 한 회사에 크게 투자해서 이겼어요. 운이 좋으면 크게 벌 수 있지만, 진짜 주식에서는 그 회사가 어려워지면 한 번에 잃을 수도 있어요. 게임이 짧아서 통한 거예요.`});
  } else if(wConc<=0.45){
    ins.push({ico:'🌈', title:'분산투자의 승리', text:`${winner.p.name}님은 여러 회사에 골고루 나눠 투자해서 이겼어요. 한 회사가 떨어져도 다른 회사가 받쳐줬죠. "계란을 한 바구니에 담지 마라"가 통한 거예요.`});
  }

  // 2. dividend
  const divEntries=Object.entries(G.log.divTotals).sort((a,b)=>b[1]-a[1]);
  if(divEntries[0] && divEntries[0][1]>=8000){
    ins.push({ico:'🎁', title:'배당의 힘', text:`${divEntries[0][0]}님은 배당금만 ${won(divEntries[0][1])}을 받았어요! 주식을 팔지 않고 가지고만 있어도 돈이 들어오는 게 배당이에요. 안정적인 회사(빵집·장난감)를 모은 보람이죠.`});
  }

  // 3. delisting
  if(G.log.delisted.length){
    const d=G.log.delisted[0];
    ins.push({ico:'💀', title:'상장폐지를 겪었어요', text:`${d.ico} ${d.nm} 회사가 주가 0원이 되어 사라졌어요(상장폐지). ${d.victim}님이 그 주식을 가지고 있었다면 휴지가 됐죠. 이래서 한 회사에 다 걸면 위험하고, 나눠 투자하는 게 안전해요.`});
  }

  // 4. close vs blowout
  const gap=winner.total-loser.total;
  if(gap<=5000){
    ins.push({ico:'🤝', title:'손에 땀을 쥔 접전!', text:`1등과 꼴찌 차이가 ${won(gap)}밖에 안 났어요. 모두가 비슷하게 잘했다는 뜻이에요. 다음엔 누가 이길까요?`});
  } else if(gap>=20000){
    ins.push({ico:'🚀', title:'큰 점수 차가 난 판', text:`점수 차이가 ${won(gap)}이나 났어요. ${winner.p.name}님의 어떤 선택이 이렇게 큰 차이를 만들었을까요? 함께 되돌아보면 좋아요.`});
  }

  // 5. goal achievement
  const metGoals=ranked.filter(r=>r.goalMet);
  if(metGoals.length){
    ins.push({ico:'🏅', title:'목표를 이룬 사람', text:`${metGoals.map(r=>r.p.name).join(', ')}님이 비밀 목표를 달성해 보너스를 받았어요. 투자에서도 "왜 투자하는지" 목표를 정하면 흔들리지 않아요.`});
  }

  // 6. always-on reminder
  ins.push({ico:'🌍', title:'기억해요', text:`이 게임에서는 예보로 앞날을 봤지만, 진짜 주식 시장에서는 아무도 내일을 알 수 없어요. 그래서 나눠 사고, 오래 기다리고, "무조건 오른다"는 말은 믿지 않는 거예요.`});

  // 7. dividend changes reminder
  ins.push({ico:'🎁', title:'배당도 변해요', text:`회사가 돈을 잘 벌면 배당을 늘리고(증배), 어려우면 줄이거나 안 주기도 해요(감배·중단). 주가만 보지 말고, 그 회사가 배당을 잘 주는지도 살펴보는 게 진짜 투자자랍니다.`});

  return ins;
}

// ---------- SAVE / LOAD HISTORY ----------
async function saveGameRecord(ranked, insights){
  try{
    let list=[];
    try{ const r=await window.storage.get('game-history'); if(r&&r.value) list=JSON.parse(r.value); }catch(e){}
    const rec={
      date:new Date().toLocaleDateString('ko-KR'),
      time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),
      players:ranked.map(r=>({name:r.p.name, av:r.p.av, total:r.total, goalMet:r.goalMet})),
      winner:ranked[0].p.name,
      gap:ranked[0].total-ranked[ranked.length-1].total,
      insightTitles:insights.map(i=>i.title)
    };
    list.unshift(rec);
    if(list.length>50) list=list.slice(0,50);
    await window.storage.set('game-history', JSON.stringify(list));
    return true;
  }catch(e){ return false; }
}

function showResults(){
  const ranked=G.players.map(p=>{
    const base=netWorth(p,G.prices);
    const goalMet=p.goal.check(p,G);
    const bonus=goalMet?p.goal.reward:0;
    return {p, base, goalMet, bonus, total:base+bonus, sv:stockValue(p,G.prices)};
  }).sort((a,b)=>b.total-a.total);

  const insights=generateInsights(ranked);
  saveGameRecord(ranked, insights); // fire and forget

  const medals=['🥇','🥈','🥉','4️⃣'];
  $('#app').innerHTML = `
    <div class="results">
      <h1>🏆 게임 종료!</h1>
      <div class="sub">12라운드 최종 결과</div>
      ${ranked.map((r,i)=>`
        <div class="rank ${i===0?'win':''}">
          <span class="medal">${medals[i]}</span>
          <div class="info">
            <div class="n">${r.p.av} ${r.p.name}</div>
            <div class="breakdown">현금 ${won(r.p.cash)} · 주식 ${won(r.sv)} ${r.goalMet?`· 🎯${r.p.goal.nm} +${won(r.bonus)}`:`· 목표 미달성`}</div>
          </div>
          <div class="total">${won(r.total)}</div>
        </div>
      `).join('')}

      <div class="insights">
        <h2>📚 오늘의 배울 점</h2>
        ${insights.map(i=>`<div class="insight"><span class="in-ico">${i.ico}</span><div><div class="in-title">${i.title}</div><div class="in-text">${i.text}</div></div></div>`).join('')}
      </div>

      <div style="display:flex;gap:8px;margin-top:20px;">
        <button class="act-pass" style="flex:1;padding:15px;" onclick="showHistory()">📊 지난 기록</button>
        <button class="start-btn" style="flex:1;margin-top:0;" onclick="renderSetup()">🔄 다시 하기</button>
      </div>
      <div class="hint-tip" style="margin-top:16px;">💡 가족과 이야기 나눠보세요: "왜 그 회사를 샀어?", "예보를 보고 어떻게 판단했어?", "한 곳에 몰빵 vs 나누기, 뭐가 좋았을까?"</div>
    </div>`;
}

// ---------- HISTORY SCREEN ----------
window.showHistory = async function(){
  let list=[];
  try{ const r=await window.storage.get('game-history'); if(r&&r.value) list=JSON.parse(r.value); }catch(e){}

  // aggregate stats
  const winCount={};
  list.forEach(rec=>{ winCount[rec.winner]=(winCount[rec.winner]||0)+1; });
  const winners=Object.entries(winCount).sort((a,b)=>b[1]-a[1]);

  $('#app').innerHTML = `
    <div class="results">
      <h1>📊 게임 기록</h1>
      <div class="sub">지금까지 ${list.length}판을 플레이했어요</div>
      ${list.length===0? `<div style="text-align:center;opacity:.6;padding:40px 20px;">아직 기록이 없어요.<br>게임을 한 판 끝내면 여기에 쌓여요!</div>` : `
        ${winners.length? `<div class="stat-box"><div class="sb-title">🏆 누가 많이 이겼나</div>
          ${winners.map(([n,c])=>`<div class="sb-row"><span>${n}</span><span><b>${c}</b>승</span></div>`).join('')}
        </div>`:''}
        <div class="stat-box"><div class="sb-title">📅 최근 게임들</div>
          ${list.slice(0,15).map(rec=>`
            <div class="hist-game">
              <div class="hg-head"><span>${rec.date} ${rec.time}</span><span class="hg-win">🥇 ${rec.winner}</span></div>
              <div class="hg-players">${rec.players.map((p,i)=>`${['🥇','🥈','🥉','4️⃣'][i]}${p.av}${p.name} ${won(p.total)}`).join('  ·  ')}</div>
              ${rec.insightTitles&&rec.insightTitles.length?`<div class="hg-ins">📚 ${rec.insightTitles.slice(0,3).join(' / ')}</div>`:''}
            </div>
          `).join('')}
        </div>
        <button class="act-pass" style="width:100%;padding:12px;margin-top:10px;font-size:13px;" onclick="clearHistory()">🗑️ 기록 모두 지우기</button>
      `}
      <button class="start-btn" style="max-width:100%;margin-top:16px;" onclick="renderSetup()">🏠 처음으로</button>
    </div>`;
};

window.clearHistory = async function(){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="modal"><div class="mi">🗑️</div><h2>기록을 모두 지울까요?</h2><p>지금까지의 모든 게임 기록이 사라져요. 되돌릴 수 없어요.</p>
    <button class="mbtn" onclick="confirmClear(this)">네, 지울게요</button>
    <button class="mbtn sec" onclick="this.closest('.overlay').remove()">취소</button></div>`;
  document.body.appendChild(ov);
};
window.confirmClear = async function(btn){
  try{ await window.storage.delete('game-history'); }catch(e){}
  btn.closest('.overlay').remove();
  toast('기록을 지웠어요');
  showHistory();
};
