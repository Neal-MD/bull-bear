<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- 아이패드/아이폰 홈 화면 추가 시 풀스크린 standalone 실행 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="불앤베어">
<title>불앤베어 꼬마투자단</title>
<style>
  /* ===================================================================
     불앤베어 — 🏦 골드 볼트 은행 테마 (2026-06-07 피벗)
     깊은 에메랄드 그린 + 금색. 본문은 밝은 아이보리(아이 가독성),
     어두움은 헤더·금고문·LED 전광판 포인트에만. 한국 증시 색(▲빨강/▼파랑) 유지.
     색: OKLCH(중립은 브랜드 그린으로 살짝 틴트). 폰트: 외부 의존성 0 시스템 스택.
     =================================================================== */
  :root{
    --bg:        oklch(0.96 0.012 155);  /* 아이보리(그린 틴트) 배경 */
    --board:     oklch(0.93 0.018 155);  /* 살짝 진한 면 */
    --surface:   oklch(0.99 0.008 150);  /* 타일/카드 표면 */
    --surface-2: oklch(0.96 0.014 152);
    --ink:       oklch(0.30 0.04 165);   /* 진한 에메랄드 잉크(검정 대신) */
    --ink-soft:  oklch(0.46 0.035 165);
    --line:      oklch(0.86 0.02 152);
    --vault:     oklch(0.34 0.062 165);  /* 금고/헤더 에메랄드 */
    --vault-deep:oklch(0.24 0.05 165);   /* 더 깊은 그린(테두리/그림자) */
    --vault-lite:oklch(0.42 0.07 165);   /* 다이얼 하이라이트 */
    --gold:      oklch(0.83 0.135 88);   /* 금색(고L→저chroma) */
    --gold-deep: oklch(0.68 0.13 80);
    --gold-soft: oklch(0.90 0.07 92);    /* 금빛 하이라이트 */
    --brass:     oklch(0.74 0.09 85);    /* 놋쇠 명패 */
    --led-bg:    oklch(0.17 0.022 162);  /* 전광판 근검정 그린 */
    --up:        oklch(0.64 0.21 28);    /* 상승=빨강 (한국 증시 관습) */
    --up-ink:    oklch(0.55 0.22 28);
    --up-led:    oklch(0.70 0.20 30);    /* 전광판 발광 빨강 */
    --down:      oklch(0.58 0.15 250);   /* 하락=파랑 */
    --down-ink:  oklch(0.48 0.17 252);
    --down-led:  oklch(0.68 0.15 250);   /* 전광판 발광 파랑 */
    --blue:      oklch(0.66 0.14 245);   /* 정보 */
    --grow:      oklch(0.66 0.19 25);    /* 성장 섹터 */
    --divd:      oklch(0.64 0.15 230);   /* 배당 섹터 */
    --mid-c:     oklch(0.72 0.12 300);   /* 중간 섹터 */
    --paper:     oklch(0.96 0.018 92);   /* 통장 종이 */
    --shadow:    0 3px 0 oklch(0.70 0.10 82 / .55), 0 7px 16px oklch(0.30 0.05 165 / .26);
    --shadow-sm: 0 2px 0 oklch(0.72 0.09 82 / .5), 0 4px 10px oklch(0.30 0.05 165 / .2);
    --shadow-gold: 0 0 0 1px var(--gold), 0 4px 14px oklch(0.68 0.13 80 / .35);
    --r:14px; --r-sm:10px;
    --font: ui-rounded, 'Apple SD Gothic Neo', 'Pretendard', system-ui, sans-serif;
    --font-led: 'DS-Digital', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:var(--font); color:var(--ink); overscroll-behavior:none; overflow-x:hidden;
    background:
      radial-gradient(circle at 12% 6%, oklch(0.93 0.05 90 / .55), transparent 40%),   /* 금빛 코너광 */
      radial-gradient(circle at 90% 96%, oklch(0.90 0.04 165 / .6), transparent 46%),   /* 에메랄드 코너광 */
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  #app { width:100%; max-width:1024px; margin:0 auto; min-height:100vh; min-height:100dvh;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  button { font-family:inherit; cursor:pointer; border:none; border-radius:var(--r-sm); font-weight:800;
           transition:transform .08s cubic-bezier(.2,.8,.3,1), filter .15s, box-shadow .15s; color:var(--ink); }
  button:active { transform:translateY(2px) scale(.99); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .num { font-variant-numeric:tabular-nums; }

  /* ===================================================================
     인게임 턴 — 스크롤 없는 보드 레이아웃
     =================================================================== */
  .turn{ position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; gap:var(--sp-2);
         padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px)
                 calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 10px);
         overflow:hidden;
         background:
           radial-gradient(circle at 50% -8%, oklch(0.93 0.05 90 / .7), transparent 50%),
           radial-gradient(circle at 50% 108%, oklch(0.90 0.04 165 / .55), transparent 48%),
           var(--board); }

  /* 톱바 — 🪟 은행 창구 카운터(에메랄드 + 골드 트림). 랭킹 흡수 */
  .topbar{ display:flex; align-items:center; gap:var(--sp-2); flex:0 0 auto;
           background:linear-gradient(180deg, var(--vault), var(--vault-deep));
           border:1.5px solid var(--gold); border-radius:14px; padding:7px 9px;
           box-shadow:var(--shadow), inset 0 1px 0 oklch(1 0 0 / .08);
           position:relative; }
  /* 카운터 상단 금색 라인(창구 트림) */
  .topbar::before{ content:""; position:absolute; left:10px; right:10px; top:3px; height:2px; border-radius:2px;
                   background:linear-gradient(90deg, transparent, var(--gold-soft), transparent); opacity:.55; }
  .tb-round{ background:linear-gradient(180deg, var(--gold-soft), var(--gold)); color:var(--vault-deep); font-weight:900; font-size:15px;
             padding:6px 13px; border-radius:999px; box-shadow:0 2px 0 var(--gold-deep); white-space:nowrap; }
  .tb-country{ background:oklch(1 0 0 / .1); color:var(--gold-soft); padding:6px 12px; border-radius:999px; font-weight:800;
               font-size:14px; border:1px solid oklch(0.83 0.135 88 / .4); white-space:nowrap; }
  /* 🪙 놋쇠 명패: 내 이름·잔액 */
  .tb-me{ display:flex; align-items:center; gap:8px; padding:5px 14px 5px 9px; border-radius:12px;
          background:linear-gradient(180deg, var(--brass), oklch(0.64 0.09 82));
          border:1px solid var(--gold-soft); box-shadow:0 2px 0 oklch(0.50 0.07 78), inset 0 1px 0 oklch(1 0 0 / .35); }
  .tb-me .av{ font-size:24px; flex:0 0 auto; filter:drop-shadow(0 1px 0 oklch(1 0 0 / .4)); }
  .tb-me .me-fig{ display:flex; flex-direction:column; line-height:1.16; }
  .tb-me .me-nm{ font-weight:800; font-size:11.5px; color:var(--vault-deep); }
  .tb-me .me-total{ font-weight:900; font-size:17px; color:var(--vault-deep); }
  .tb-me .me-split{ font-size:11px; font-weight:700; color:oklch(0.32 0.05 120); }
  .tb-rank{ display:flex; gap:4px; margin-left:auto; align-items:center; overflow:hidden; }
  .tb-rk{ font-size:12px; font-weight:800; background:oklch(1 0 0 / .1); color:var(--gold-soft); padding:4px 8px; border-radius:999px;
          white-space:nowrap; border:1px solid oklch(1 0 0 / .12); }
  .tb-rk.me{ background:linear-gradient(180deg, var(--gold-soft), var(--gold)); color:var(--vault-deep); border-color:var(--gold); }
  .tb-ico{ width:38px; height:38px; border-radius:50%; background:oklch(1 0 0 / .12); font-size:18px; color:var(--gold-soft);
           display:grid; place-items:center; border:1px solid oklch(0.83 0.135 88 / .5); flex:0 0 auto; }

  /* 예보 스트립 — 크고 잘 보이게 (남는 공간 차지) */
  .fcstrip{ flex:0 0 auto; display:flex; gap:var(--sp-2); align-items:stretch; }
  .fcbox{ flex:1; border-radius:var(--r); padding:12px 15px; box-shadow:var(--shadow-sm); display:flex;
          flex-direction:column; gap:9px; min-width:0; justify-content:center; }
  .fcbox.now{ background:linear-gradient(160deg, oklch(0.97 0.06 95), oklch(0.92 0.10 78)); }
  .fcbox.next{ background:var(--surface); }
  .fcbox.fog{ background:repeating-linear-gradient(45deg, var(--surface), var(--surface) 9px, var(--surface-2) 9px, var(--surface-2) 18px); }
  .fc-lbl{ font-size:13px; font-weight:900; color:var(--ink-soft); }
  .mini-ev{ display:flex; align-items:center; gap:9px; }
  .mini-ev .mi-ico{ font-size:26px; flex:0 0 auto; }
  .mini-ev .mi-tx{ font-size:14.5px; font-weight:800; flex:1; line-height:1.2; min-width:0; }
  .mini-ev .mi-ef{ font-size:14.5px; font-weight:900; white-space:nowrap; }
  .mini-ev .mi-ef.up{ color:var(--up-ink); } .mini-ev .mi-ef.down{ color:var(--down-ink); }

  /* 예보 슬롯 릴 — 세로로 도는 뉴스. 이번 라운드가 위쪽에서 항상 금빛으로 강조,
     지난은 위로 살짝 굴려서(roll-up) 보고, 다음은 아래에 덜 강조로 보임 */
  /* 📟 LED 시세 전광판: 근검정 보드 + 골드 프레임 */
  .fcreel-wrap{ flex:0 0 auto; position:relative; border-radius:var(--r);
                background:
                  radial-gradient(circle at 50% 0%, oklch(0.24 0.04 162 / .9), transparent 60%),
                  var(--led-bg);
                border:2px solid var(--gold); padding:3px 6px;
                box-shadow:var(--shadow), inset 0 0 22px oklch(0 0 0 / .55), inset 0 1px 0 oklch(1 0 0 / .06); }
  /* 전광판 스캔라인(아주 은은) */
  .fcreel-wrap::before{ content:""; position:absolute; inset:2px; border-radius:12px; pointer-events:none; z-index:2;
                        background:repeating-linear-gradient(0deg, transparent 0 3px, oklch(0 0 0 / .14) 3px 4px); opacity:.5; }
  .fcreel{ height:clamp(166px, 31vh, 262px); overflow-y:auto; overflow-x:hidden;
           scroll-snap-type:y proximity; scroll-padding-top:18px; overscroll-behavior:contain;
           -webkit-overflow-scrolling:touch; scrollbar-width:none; position:relative;
           display:flex; flex-direction:column; gap:var(--sp-2); padding:10px 2px 14px;
           -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 5%, #000 92%, transparent 100%);
                   mask-image:linear-gradient(180deg, transparent 0, #000 5%, #000 92%, transparent 100%); }
  .fcreel::-webkit-scrollbar{ display:none; }

  .fcrow{ scroll-snap-align:start; flex:0 0 auto; border-radius:var(--r-sm); padding:8px 12px;
          background:linear-gradient(180deg, oklch(0.23 0.03 162), oklch(0.19 0.025 162));
          border:1px solid oklch(0.83 0.135 88 / .22);
          box-shadow:inset 0 1px 0 oklch(1 0 0 / .05); position:relative; overflow:hidden; cursor:pointer;
          transition:transform .22s cubic-bezier(.2,.8,.3,1), opacity .22s, box-shadow .22s, filter .22s; }
  .fcrow .fc-rlabel{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:900;
                     color:var(--gold-soft); margin-bottom:5px; letter-spacing:.4px; text-transform:none; }
  .fcrow .fc-rbody{ display:flex; flex-direction:column; gap:5px; }

  /* 뉴스 = 보드게임 속보 티커 칩: 동전 메달 + 굵은 헤드라인 + 꽉 찬 컬러 배지 */
  .fcrow .mini-ev{ display:flex; align-items:center; gap:9px; }
  .fcrow .mi-ico{ flex:0 0 auto; width:35px; height:35px; border-radius:50%; display:grid; place-items:center;
                  font-size:18px; line-height:1;
                  background:radial-gradient(circle at 33% 28%, oklch(1 0 0 / .95), oklch(0.92 0.03 90 / .55) 72%);
                  box-shadow:0 2px 0 oklch(0.80 0.04 75), inset 0 0 0 1.5px oklch(1 0 0 / .7); }
  .fcrow .mi-tx{ flex:1; min-width:0; font-size:13.5px; font-weight:800; line-height:1.18; color:oklch(0.93 0.02 150); }
  .fcrow .mi-ef{ flex:0 0 auto; font-size:13px; font-weight:900; white-space:nowrap; color:#fff;
                 padding:5px 11px; border-radius:8px; letter-spacing:.3px;
                 box-shadow:0 0 0 1px oklch(1 0 0 / .15), inset 0 1px 0 oklch(1 0 0 / .25); }
  /* LED 발광 글자(빨강 오름 / 파랑 내림) */
  .fcrow .mini-ev.up   .mi-ef{ background:oklch(0.30 0.10 28); color:var(--up-led); border:1px solid var(--up-led);
                               text-shadow:0 0 7px var(--up-led); box-shadow:0 0 9px oklch(0.64 0.21 28 / .5); }
  .fcrow .mini-ev.down .mi-ef{ background:oklch(0.26 0.07 250); color:var(--down-led); border:1px solid var(--down-led);
                               text-shadow:0 0 7px var(--down-led); box-shadow:0 0 9px oklch(0.58 0.15 250 / .5); }
  .fcrow .mini-ev.dvd  .mi-ef{ background:oklch(0.34 0.09 86); color:var(--gold-soft); border:1px solid var(--gold);
                               text-shadow:0 0 7px var(--gold); }
  .fcrow .mini-ev.fog  .mi-ef{ background:oklch(0.30 0.08 300); color:oklch(0.82 0.12 300); border:1px solid oklch(0.7 0.12 300);
                               text-shadow:0 0 7px oklch(0.72 0.13 300); }
  .fcrow .mini-ev.up   .mi-ico{ background:radial-gradient(circle at 33% 28%, oklch(1 0 0 / .97), oklch(0.86 0.12 30 / .6) 72%);
                                box-shadow:0 2px 0 oklch(0.66 0.13 30), inset 0 0 0 1.5px oklch(1 0 0 / .7); }
  .fcrow .mini-ev.down .mi-ico{ background:radial-gradient(circle at 33% 28%, oklch(1 0 0 / .97), oklch(0.82 0.10 250 / .6) 72%);
                                box-shadow:0 2px 0 oklch(0.60 0.12 252), inset 0 0 0 1.5px oklch(1 0 0 / .7); }
  .fcrow .mini-ev.dvd  .mi-ico{ background:radial-gradient(circle at 33% 28%, oklch(1 0 0 / .97), oklch(0.88 0.13 85 / .65) 72%);
                                box-shadow:0 2px 0 oklch(0.70 0.13 80), inset 0 0 0 1.5px oklch(1 0 0 / .7); }
  .fcrow .mini-ev.fog  .mi-ico{ background:radial-gradient(circle at 33% 28%, oklch(1 0 0 / .95), oklch(0.82 0.10 300 / .55) 72%); }

  /* 지난은 가장 흐릿(굴려서 보기), 다음은 덜 흐릿, 다다음 더 흐릿 */
  .fcrow.r-past{ opacity:.52; filter:saturate(.6);  transform:scale(.975); }
  .fcrow.r-next{ opacity:.85; transform:scale(.99); }
  .fcrow.r-soon{ opacity:.5;  filter:saturate(.55); transform:scale(.97); }
  .fc-hidden .fc-rbody{ flex-direction:row; align-items:center; gap:9px; }
  .fc-hidden .fc-qm{ font-size:20px; color:oklch(0.72 0.13 300); text-shadow:0 0 8px oklch(0.6 0.12 300); } .fc-hidden .fc-qtx{ font-size:12px; font-weight:800; color:oklch(0.7 0.05 150); }

  /* 이번 라운드 — 항상 금빛 강조 + 샤인 + 흰 프로스트 서브카드로 팝업 */
  .fcrow.lit{ opacity:1; transform:scale(1); filter:none; border-radius:var(--r); padding:11px 13px;
              background:linear-gradient(180deg, oklch(0.28 0.045 162), oklch(0.21 0.03 162));
              border:2px solid var(--gold);
              box-shadow:var(--shadow), 0 0 0 1px var(--gold-soft) inset, 0 0 26px oklch(0.83 0.135 88 / .4); }
  .fcrow.lit .fc-rlabel{ color:var(--gold-soft); font-size:13px; text-shadow:0 0 8px oklch(0.83 0.135 88 / .6); }
  .fcrow.lit .fc-rbody{ gap:8px; }
  .fcrow.lit .mini-ev{ background:oklch(0.16 0.02 162 / .85); border-radius:11px; padding:7px 10px;
                       border:1px solid oklch(0.83 0.135 88 / .25); box-shadow:inset 0 0 14px oklch(0 0 0 / .5); }
  .fcrow.lit .mi-ico{ width:43px; height:43px; font-size:23px; }
  .fcrow.lit .mi-tx{ font-size:16px; font-weight:900; color:oklch(0.96 0.02 150); }
  .fcrow.lit .mi-ef{ font-size:15px; padding:6px 13px; }
  .fcrow.lit::after{ content:""; position:absolute; inset:0; pointer-events:none; transform:translateX(-130%);
                     background:linear-gradient(105deg, transparent 36%, oklch(1 0 0 / .55) 50%, transparent 64%); }

  /* 지금(LIVE) 점멸 점 */
  .fc-livedot{ position:relative; flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--up); }
  .fc-livedot::after{ content:""; position:absolute; inset:0; border-radius:50%; background:var(--up); }

  @media (prefers-reduced-motion: no-preference){
    .fcrow.lit::after{ animation:fcshine 3.8s ease-in-out .6s infinite; }
    .fcrow.lit .fc-rbody .mini-ev{ animation:fcpop .5s cubic-bezier(.2,.85,.3,1) both; }
    .fcrow.lit .fc-rbody .mini-ev:nth-child(2){ animation-delay:.09s; }
    .fc-livedot::after{ animation:fclive 1.7s ease-out infinite; }
  }
  @keyframes fcshine{ 0%{ transform:translateX(-130%); } 55%,100%{ transform:translateX(240%); } }
  @keyframes fcpop{ 0%{ opacity:0; transform:translateY(7px) scale(.96); } 100%{ opacity:1; transform:none; } }
  @keyframes fclive{ 0%{ transform:scale(1); opacity:.55; } 70%,100%{ transform:scale(2.7); opacity:0; } }

  /* 보드 — 타일 컴팩트(고정 높이, 공간 낭비 줄임) */
  .board{ flex:1 1 auto; align-content:center; min-height:0; display:grid; grid-template-columns:repeat(3,1fr);
          grid-auto-rows:minmax(112px, 168px); gap:var(--sp-2); }
  /* 🪙 금고 자산 카드: 골드 헤어라인 + 살짝 금빛 인셋 */
  .tile{ background:
           radial-gradient(circle at 50% 12%, oklch(0.97 0.03 92 / .7), transparent 60%),
           var(--surface);
         border-radius:var(--r); box-shadow:var(--shadow), inset 0 0 0 1px oklch(0.83 0.135 88 / .35);
         position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
         padding:7px 6px; overflow:hidden; border-top:6px solid var(--mid-c); }
  .tile.growth{ border-top-color:var(--grow); }
  .tile.divid{ border-top-color:var(--divd); }
  .tile.dead{ opacity:.5; filter:grayscale(.7); }
  .tile .t-ico{ font-size:22px; line-height:1; }
  .tile .t-sector{ font-size:11px; font-weight:800; color:var(--ink-soft); background:var(--surface-2);
                   padding:1px 9px; border-radius:999px; line-height:1.45; }
  .tile .t-nm{ font-size:13.5px; font-weight:900; color:var(--ink); line-height:1.05; text-align:center; }
  .tile .t-prc{ display:flex; align-items:baseline; gap:5px; cursor:pointer; }
  .tile .t-chart-ic{ font-size:11px; opacity:.5; align-self:center; }
  .tile .t-pr{ font-size:clamp(18px, 2.7vh, 23px); font-weight:900; color:var(--ink); }
  .tile .t-chg{ font-size:12.5px; font-weight:900; }
  .tile .t-chg.up{ color:var(--up-ink); } .tile .t-chg.down{ color:var(--down-ink); }
  .tile .t-own{ position:absolute; top:7px; right:7px; font-size:11px; font-weight:900; color:var(--ink);
                background:var(--gold); border-radius:999px; padding:1px 7px; box-shadow:var(--shadow-sm); }
  .tile .t-coach{ position:absolute; top:7px; left:7px; font-size:16px; }
  .t-pm{ display:flex; gap:6px; width:100%; margin-top:3px; }
  .t-pm button{ flex:1; padding:8px 0; font-size:17px; font-weight:900; border-radius:var(--r-sm); color:#fff;
                box-shadow:var(--shadow-sm); }
  .t-pm .minus{ background:var(--down); }
  .t-pm .plus{ background:var(--up); }
  .t-pm button:disabled{ box-shadow:none; }

  /* 가격 차트 모달 */
  .chart-modal{ max-width:min(94vw,460px); }
  .chart-modal .ch-head{ display:flex; align-items:center; gap:8px; }
  .chart-modal .ch-ico{ font-size:26px; }
  .chart-modal .ch-nm{ font-weight:900; font-size:18px; flex:1; text-align:left; }
  .chart-modal .ch-cur{ font-weight:900; font-size:18px; }
  .chart-modal .ch-sub{ font-size:11.5px; color:var(--ink-soft); margin:3px 0 8px; text-align:left; }
  .chart-modal .ch-svg{ width:100%; height:auto; background:var(--surface-2); border-radius:var(--r-sm); display:block; }
  .chart-modal .ch-div{ text-align:left; font-size:13px; line-height:1.5; background:oklch(0.97 0.06 95);
                        border-radius:var(--r-sm); padding:10px 13px; margin:11px 0; }
  .chart-modal .ch-div.none{ background:var(--surface-2); }
  .chart-modal .ch-div-note{ font-size:11px; color:var(--ink-soft); margin-top:6px; }

  /* 하단 액션바 */
  .actionbar{ flex:0 0 auto; display:flex; align-items:center; gap:var(--sp-2); }
  .act-left{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:800; color:var(--ink-soft);
             background:var(--surface); padding:8px 12px; border-radius:999px; box-shadow:var(--shadow-sm); white-space:nowrap; }
  .act-dot{ width:13px; height:13px; border-radius:50%; background:var(--line); transition:background .2s, transform .2s; }
  .act-dot.on{ background:var(--gold-deep); transform:scale(1.1); }
  .actionbar .ab-btn{ padding:11px 14px; font-size:14px; font-weight:800; border-radius:var(--r-sm);
                      background:var(--surface); box-shadow:var(--shadow-sm); border:1px solid var(--line); }
  .actionbar .ab-card{ background:oklch(0.86 0.12 300); color:var(--ink); border-color:transparent; }
  .actionbar .ab-pass{ background:linear-gradient(180deg, var(--gold-soft), var(--gold)); color:var(--vault-deep); border-color:var(--gold-deep); }
  .actionbar .ab-undo{ background:var(--surface-2); }
  .actionbar .ab-end{ background:linear-gradient(180deg, var(--vault-lite), var(--vault)); color:var(--gold-soft);
                      border:1px solid var(--gold); margin-left:auto; padding:11px 20px; font-size:15px; box-shadow:var(--shadow-sm); }
  .act-left{ border:1px solid var(--line); }

  /* 마스코트 */
  /* 마스코트 — 평소엔 숨김, 거래 시에만 팡! */
  .mascot{ position:absolute; bottom:74px; font-size:54px; pointer-events:none; z-index:6; opacity:0;
           filter:drop-shadow(0 5px 7px oklch(0.5 0.05 60 / .35)); }
  .mascot.bull{ left:12px; } .mascot.bear{ right:12px; }
  .mascot.cheer{ animation:bullCharge .8s ease-out; } .mascot.boo{ animation:bearDrop .8s ease-out; }

  /* 코치 패널(켰을 때, 보드 위 떠 있는 토스트형) */
  .coach-panel{ flex:0 0 auto; background:var(--surface); border-radius:var(--r); padding:8px 11px;
                box-shadow:var(--shadow-sm); max-height:74px; overflow-y:auto; }
  .coach-head{ font-size:12px; font-weight:900; color:var(--blue); margin-bottom:6px; }
  .coach-row{ font-size:12.5px; padding:5px 8px; border-radius:var(--r-sm); margin-bottom:4px; line-height:1.35; background:var(--surface-2); }
  .coach-row.buy-row{ background:oklch(0.94 0.07 28); }
  .coach-row.sell-row{ background:oklch(0.94 0.06 250); }
  .cr-tag{ font-weight:900; }
  .buy-row .cr-tag{ color:var(--up-ink); } .sell-row .cr-tag{ color:var(--down-ink); }

  /* 손패 카드 트레이 (오버레이) */
  .hand-tray{ position:absolute; left:8px; right:8px; bottom:58px; z-index:9; background:var(--surface);
              border-radius:var(--r); padding:12px; box-shadow:var(--shadow); }
  .hand-tray h3{ font-size:13px; color:var(--ink-soft); margin-bottom:8px; display:flex; justify-content:space-between; }
  .hand-cards{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .hcard{ min-width:138px; background:linear-gradient(160deg, oklch(0.96 0.06 300), oklch(0.90 0.10 290));
          border-radius:var(--r-sm); padding:10px; box-shadow:var(--shadow-sm); }
  .hcard .hi{ font-size:22px; text-align:center; }
  .hcard .hn{ font-weight:900; text-align:center; font-size:13px; margin:2px 0; }
  .hcard .he{ color:var(--ink-soft); line-height:1.3; font-size:11px; min-height:44px; }
  .hcard button{ width:100%; padding:8px; background:var(--gold); margin-top:6px; font-size:12px; box-shadow:var(--shadow-sm); }

  /* ===================================================================
     SETUP — 밝은 보드 톤
     =================================================================== */
  .setup{ position:fixed; inset:0; overflow:hidden; display:flex; flex-direction:column; gap:8px;
          padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px)
                  calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 14px);
          background:
            radial-gradient(circle at 50% -8%, oklch(0.93 0.05 90 /.7), transparent 48%),
            radial-gradient(circle at 50% 108%, oklch(0.90 0.04 165 /.5), transparent 46%),
            var(--board); }
  .setup-head{ text-align:center; flex:0 0 auto; }
  .setup .logo{ font-size:32px; line-height:1; filter:drop-shadow(0 3px 4px oklch(0.3 0.05 165 /.25)); }
  .brand{ font-size:clamp(30px,7vw,48px); font-weight:900; line-height:.92; letter-spacing:-.03em;
          text-shadow:0 3px 0 oklch(0.88 0.05 92); }
  .brand .b-bull{ color:var(--up-ink); }
  .brand .b-bear{ color:var(--down-ink); }
  .brand .b-amp{ color:var(--gold-deep); margin:0 .1em; font-size:.78em; vertical-align:.06em; }
  .brand-sub{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }

  .setup-cols{ flex:1 1 auto; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:stretch; }
  .setup .card{ background:var(--surface); border-radius:var(--r); padding:13px 14px; text-align:left;
                box-shadow:var(--shadow), inset 0 0 0 1px oklch(0.83 0.135 88 / .3); overflow:hidden; }
  .setup .card h3{ font-size:12.5px; margin-bottom:7px; color:var(--ink-soft); font-weight:900; }
  .setup .card h3.mt{ margin-top:12px; }

  .pcount{ display:flex; gap:7px; }
  .pcount button{ flex:1; padding:9px; background:var(--surface-2); font-size:15px; box-shadow:var(--shadow-sm); }
  .pcount button.sel{ background:var(--gold); }

  .preset-row{ display:flex; gap:6px; }
  .preset{ flex:1; background:var(--surface-2); padding:9px 6px; text-align:center; border:3px solid transparent;
           border-radius:var(--r-sm); box-shadow:var(--shadow-sm); }
  .preset.sel{ background:oklch(0.92 0.07 90); border-color:var(--gold); }
  .preset .pr-name{ font-size:14px; font-weight:900; }
  .preset .pr-desc{ font-size:10px; color:var(--ink-soft); line-height:1.2; margin-top:2px; }

  .opts{ display:flex; flex-direction:column; gap:5px; }
  .opt-row{ display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .opt-lbl{ font-size:12px; font-weight:700; color:var(--ink-soft); white-space:nowrap; }
  .opt-btns{ display:flex; gap:4px; }
  .opt-btns button{ padding:5px 9px; background:var(--surface-2); font-size:11.5px; box-shadow:var(--shadow-sm); }
  .opt-btns button.sel{ background:var(--gold); }

  .country-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .country-btn{ background:var(--surface-2); padding:7px 4px; border:3px solid transparent; border-radius:var(--r-sm);
                text-align:center; box-shadow:var(--shadow-sm); }
  .country-btn.sel{ background:oklch(0.94 0.06 90); border-color:var(--gold); }
  .ct-flag{ font-size:24px; }
  .ct-name{ font-size:12px; font-weight:900; margin:1px 0; }
  .ct-badge{ font-size:11px; }
  .cd-kid{ margin-top:5px; font-size:11.5px; line-height:1.4; color:var(--ink); }
  .country-detail{ background:var(--surface-2); border-radius:var(--r-sm); padding:8px 10px; margin-top:7px; font-size:11.5px; }
  .cd-flag{ margin-bottom:4px; } .cd-flag b{ color:var(--gold-deep); }
  .cd-cos{ display:flex; flex-wrap:wrap; gap:5px; }
  .cd-co{ background:var(--surface); padding:2px 7px; border-radius:999px; font-size:10.5px; box-shadow:var(--shadow-sm); }
  .pname{ display:flex; gap:7px; margin-bottom:6px; align-items:center; }
  .pname input{ flex:1; padding:8px 11px; border-radius:var(--r-sm); border:2px solid var(--line);
                background:var(--surface); color:var(--ink); font-size:14px; font-family:inherit; font-weight:700; }
  .pname input:focus{ outline:none; border-color:var(--gold); }
  .pname .em{ font-size:22px; width:30px; text-align:center; }
  .start-btn{ width:100%; padding:14px; background:linear-gradient(160deg, var(--gold), var(--gold-deep));
              color:var(--ink); font-size:18px; margin-top:12px; box-shadow:var(--shadow); font-weight:900; }
  .setup-foot{ flex:0 0 auto; display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
  .setup-foot .fbadge{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);
                       border-radius:999px; padding:8px 15px; font-size:12.5px; font-weight:800; }
  .setup-foot .fbadge.main{ background:var(--gold); }
  .ct-legend{ font-size:10.5px; color:var(--ink-soft); margin-top:6px; line-height:1.4; }
  .ct-legend b{ color:var(--ink); }
  /* 보조 버튼(지난 기록/지우기 등) — 밝은 테마 호환 */
  .act-pass{ background:var(--surface) !important; color:var(--ink) !important; box-shadow:var(--shadow-sm); }

  /* doc viewer */
  .doc-view{ padding:18px 18px 60px; max-width:760px; margin:0 auto; }
  .doc-hdr{ display:flex; align-items:center; gap:12px; margin-bottom:16px; position:sticky; top:0; background:var(--bg); padding:10px 0; }
  .doc-hdr h1{ font-size:21px; color:var(--gold-deep); font-weight:900; }
  .back-btn{ background:var(--surface); padding:9px 15px; font-size:13px; box-shadow:var(--shadow-sm); }
  .doc-body{ background:var(--surface); border-radius:var(--r); padding:20px 22px; text-align:left; line-height:1.7; box-shadow:var(--shadow); }
  .doc-body h3{ font-size:15px; color:var(--blue); margin:16px 0 5px; font-weight:900; }
  .doc-body h3:first-child{ margin-top:0; }
  .doc-body p{ font-size:14px; color:var(--ink); margin-bottom:4px; }
  .doc-body b{ color:var(--gold-deep); }

  /* ===================================================================
     MODAL / OVERLAY / TOAST — 밝게
     =================================================================== */
  .overlay{ position:fixed; inset:0; background:oklch(0.20 0.045 165 / .62); display:flex; align-items:center;
            justify-content:center; z-index:200; padding:20px; backdrop-filter:blur(2px); }
  .modal{ background:var(--surface); border-radius:20px; padding:24px; max-width:440px; width:100%;
          text-align:center; border:2px solid var(--gold);
          box-shadow:0 18px 50px oklch(0.2 0.04 165 / .45), inset 0 1px 0 oklch(1 0 0 / .5); }
  .modal .mi{ font-size:52px; }
  .modal h2{ font-size:23px; margin:8px 0; font-weight:900; color:var(--vault); }
  .modal p{ color:var(--ink-soft); margin-bottom:16px; line-height:1.5; font-size:14px; }
  .modal .mbtn{ width:100%; padding:15px; font-size:16px; color:var(--vault-deep); border:1px solid var(--gold-deep);
                background:linear-gradient(180deg, var(--gold-soft), var(--gold)); box-shadow:0 3px 0 var(--gold-deep); }
  .modal .mbtn.sec{ background:var(--surface-2); color:var(--ink); border-color:var(--line); box-shadow:var(--shadow-sm); margin-top:8px; }
  .modal .mbtn.ghost{ background:oklch(0.97 0.012 150); color:var(--vault); border:1.5px solid var(--vault-lite);
                      box-shadow:none; margin-top:10px; font-size:14px; padding:12px; }
  /* 🏦 금고 입장 느낌 패스 화면 */
  .pass-player{ background:linear-gradient(165deg, oklch(0.97 0.02 150), oklch(0.93 0.03 120)); position:relative; }
  .pass-player .vault-badge{ font-size:30px; width:54px; height:54px; margin:0 auto 2px; border-radius:50%;
        display:grid; place-items:center; background:linear-gradient(180deg, var(--vault-lite), var(--vault));
        color:var(--gold-soft); border:2px solid var(--gold); box-shadow:0 3px 0 var(--vault-deep); }
  .order-banner{ background:oklch(0.96 0.03 92); border:1px dashed var(--gold-deep); border-radius:var(--r-sm);
                 padding:10px 12px; margin-bottom:12px; font-size:12.5px; color:var(--ink); font-weight:700; line-height:1.6; }
  .order-banner b{ color:var(--vault); font-size:14px; }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:oklch(0.97 0.02 90);
          padding:12px 22px; border-radius:999px; z-index:300; font-size:14px; font-weight:800;
          box-shadow:0 8px 22px oklch(0.4 0.05 60 / .4); animation:pop .3s; max-width:88%; text-align:center; }
  @keyframes pop{ from{opacity:0; transform:translateX(-50%) translateY(12px) scale(.96);} to{opacity:1; transform:translateX(-50%) translateY(0) scale(1);} }

  /* 이벤트 공개 */
  .ev-pair{ display:flex; gap:8px; margin-bottom:14px; }
  .ev-one{ flex:1; border-radius:var(--r); padding:14px 8px; box-shadow:var(--shadow-sm); animation:flipIn .5s cubic-bezier(.2,.8,.3,1) backwards; }
  .ev-one.up{ background:oklch(0.94 0.08 28); }
  .ev-one.down{ background:oklch(0.94 0.07 250); }
  .ev-one.divev{ background:oklch(0.94 0.08 90); }
  .ev-one .eo-ico{ font-size:36px; }
  .ev-one .eo-tx{ font-size:13px; font-weight:900; margin:3px 0; line-height:1.25; }
  .ev-one .eo-ef{ font-size:12px; font-weight:800; color:var(--ink-soft); }
  .ev-one.up .eo-ef{ color:var(--up-ink); } .ev-one.down .eo-ef{ color:var(--down-ink); }
  .event-reveal .mi{ font-size:60px; }
  /* 📔 통장 결산: 종이 + 장부 줄 */
  .modal.event-reveal{ background:
        linear-gradient(180deg, oklch(0.99 0.01 92), var(--paper));
        border:2px solid var(--gold); }
  .ev-effect{ font-size:18px; font-weight:900; margin:10px 0; }
  .ev-detail{ background:var(--paper); border:1px solid oklch(0.83 0.135 88 / .4); border-radius:var(--r-sm);
              padding:12px; font-size:13px; margin-bottom:14px; text-align:left; }
  .ev-detail>div:first-child{ color:var(--vault); }
  .ev-detail .row{ display:flex; justify-content:space-between; padding:5px 1px; border-bottom:1px dashed oklch(0.78 0.04 92); }
  .ev-detail .row:last-child{ border-bottom:none; }
  .ev-detail .row .up{ color:var(--up-ink); font-weight:800; } .ev-detail .row .down{ color:var(--down-ink); font-weight:800; }
  .rank-row{ font-weight:700; }
  .delta{ font-size:11px; font-weight:900; margin-left:4px; }
  .delta.up{ color:var(--up-ink); } .delta.down{ color:var(--down-ink); }
  .swan-banner{ background:oklch(0.90 0.12 28); border-radius:var(--r); padding:12px; margin-bottom:14px; text-align:left; animation:shake .5s; }
  .swan-banner .sb-h{ font-weight:900; font-size:14px; color:var(--down-ink); margin-bottom:6px; }
  .swan-banner .sb-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:2px 0; }
  .swan-banner .sb-row .down{ color:var(--down-ink); font-weight:900; }
  .drift-note{ background:oklch(0.93 0.08 150); border-radius:var(--r-sm); padding:7px 10px; font-size:12px; color:var(--up-ink); margin-bottom:12px; text-align:left; font-weight:700; }

  /* results */
  .results{ padding:24px 20px 48px; }
  .results h1{ text-align:center; font-size:30px; color:var(--gold-deep); margin-bottom:4px; font-weight:900; }
  .results .sub{ text-align:center; color:var(--ink-soft); margin-bottom:20px; font-size:13px; }
  .rank{ background:var(--surface); border-radius:var(--r); padding:16px; margin-bottom:10px; display:flex;
         align-items:center; gap:12px; box-shadow:var(--shadow-sm); }
  .rank.win{ background:linear-gradient(160deg, oklch(0.96 0.08 90), var(--surface)); box-shadow:var(--shadow); }
  .rank .medal{ font-size:32px; }
  .rank .info{ flex:1; }
  .rank .info .n{ font-size:16px; font-weight:900; }
  .rank .info .d{ font-size:11px; color:var(--ink-soft); }
  .rank .total{ font-size:21px; font-weight:900; color:var(--gold-deep); }
  .breakdown{ font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .hint-tip{ background:oklch(0.95 0.06 90); border-radius:var(--r-sm); padding:9px 13px; font-size:12.5px; margin:8px 0; color:var(--ink); font-weight:600; }

  .insights{ margin-top:22px; }
  .insights h2{ font-size:17px; color:var(--gold-deep); margin-bottom:12px; text-align:center; font-weight:900; }
  .insight{ display:flex; gap:12px; background:var(--surface); border-radius:var(--r); padding:14px; margin-bottom:9px; text-align:left; box-shadow:var(--shadow-sm); }
  .insight .in-ico{ font-size:28px; flex-shrink:0; }
  .insight .in-title{ font-weight:900; font-size:14px; margin-bottom:3px; }
  .insight .in-text{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }

  /* history */
  .stat-box{ background:var(--surface); border-radius:var(--r); padding:16px; margin-bottom:12px; text-align:left; box-shadow:var(--shadow-sm); }
  .sb-title{ font-weight:900; font-size:14px; margin-bottom:10px; color:var(--gold-deep); }
  .sb-row{ display:flex; justify-content:space-between; padding:5px 0; font-size:14px; border-bottom:1px dashed var(--line); }
  .sb-row:last-child{ border-bottom:none; } .sb-row b{ color:var(--gold-deep); }
  .hist-game{ background:var(--surface-2); border-radius:var(--r-sm); padding:11px; margin-bottom:8px; }
  .hg-head{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .hg-win{ color:var(--gold-deep); font-weight:800; }
  .hg-players{ font-size:12px; line-height:1.5; }
  .hg-ins{ font-size:11px; color:var(--ink-soft); margin-top:5px; }

  /* 선택 모달용 트레이드 그리드(카드 사용 시) */
  .trade{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
  .tcard{ background:var(--surface-2); border-radius:var(--r-sm); padding:8px 6px; text-align:center; box-shadow:var(--shadow-sm); }
  .tcard .ti{ font-size:22px; } .tcard .tp{ font-size:13px; font-weight:900; }
  .tcard .town{ font-size:10px; color:var(--ink-soft); min-height:13px; }
  .tcard .buy{ background:var(--up); color:#fff; width:100%; margin-top:5px; padding:7px 0; box-shadow:var(--shadow-sm); }

  /* ===================================================================
     효과 (transform/opacity 위주)
     =================================================================== */
  .flash-up{ animation:flashUp .6s ease-out; }
  .flash-down{ animation:flashDown .6s ease-out; }
  @keyframes flashUp{ 0%{ transform:translateY(0); } 30%{ transform:translateY(-7px); box-shadow:0 0 0 4px oklch(0.64 0.21 28 / .5), var(--shadow); } 100%{ transform:translateY(0); } }
  @keyframes flashDown{ 0%{ transform:translateY(0); } 30%{ transform:translateY(6px); box-shadow:0 0 0 4px oklch(0.58 0.15 250 / .45), var(--shadow); } 100%{ transform:translateY(0); } }
  @keyframes bullCharge{ 0%{ opacity:0; transform:translateX(0) translateY(10px) scale(.7); } 25%{ opacity:1; transform:translateX(12px) translateY(-12px) rotate(-9deg) scale(1.1); } 70%{ opacity:1; } 100%{ opacity:0; transform:translateX(0) translateY(0) scale(1); } }
  @keyframes bearDrop{ 0%{ opacity:0; transform:translateY(-8px) scale(.7); } 25%{ opacity:1; transform:translateY(12px) rotate(9deg) scale(1.1); } 70%{ opacity:1; } 100%{ opacity:0; transform:translateY(0) scale(1); } }
  @keyframes flipIn{ from{ opacity:0; transform:perspective(600px) rotateX(40deg) translateY(10px); } to{ opacity:1; transform:none; } }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px); } 40%{ transform:translateX(6px); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(3px); } }
  .coin{ position:fixed; font-size:26px; z-index:400; pointer-events:none; will-change:transform,opacity;
         animation:coinFly .9s cubic-bezier(.25,.7,.4,1) forwards; }
  @keyframes coinFly{ 0%{ opacity:0; transform:translate(0,4px) scale(.6); }
                      18%{ opacity:1; transform:translate(calc(var(--cdx,0)*.4), -34px) scale(1.25); }

    const when = slot===0 ? '곧' : slot===1 ? '다음 라운드에' : `${slot+1}라운드 뒤에`;
    const targets = ev.who==='all' ? COMPANIES.map(c=>c.id) : ev.who;
    targets.forEach(cid=>{
      if(G.prices[cid]<=0) return; // 상폐(0원) 회사는 예보 분석에서 제외 — 죽은 회사가 오른다고 표시되지 않게
      const nm=COMPANIES.find(c=>c.id===cid).nm;
      if(ev.kind==='div'){
        if(ev.divMul>1){ advice[cid].score+=1; advice[cid].reasons.push(`${when} ${nm} 배당이 늘어요 (${ev.tx})`); }
        else if(ev.divMul<1){ advice[cid].score-=0.5; advice[cid].reasons.push(`${when} ${nm} 배당이 줄어요`); }
      } else {
        if(ev.steps>0){ advice[cid].score+=ev.steps; advice[cid].reasons.push(`${when} ${nm} 주가가 올라요 (${ev.tx})`); }
        else if(ev.steps<0){ advice[cid].score+=ev.steps; advice[cid].reasons.push(`${when} ${nm} 주가가 내려요 (${ev.tx})`); }
      }
    });
    if(ev.chain && ev.who!=='all' && G.prices[ev.chain.who]>0){
      const cid=ev.chain.who; const nm=COMPANIES.find(c=>c.id===cid).nm;
      if(ev.chain.steps>0){ advice[cid].score+=ev.chain.steps; advice[cid].reasons.push(`${when} ${nm} 주가가 함께 올라요 (연동)`); }
      else if(ev.chain.steps<0){ advice[cid].score+=ev.chain.steps; advice[cid].reasons.push(`${when} ${nm} 주가가 함께 내려요 (연동)`); }
    }
  });
  Object.values(advice).forEach(a=>{ a.dir = a.score>0?'buy' : a.score<0?'sell' : null; });
  return advice;
}

const $ = sel => document.querySelector(sel);
const won = n => n.toLocaleString('ko-KR')+'원';
const wonK = n => n>=10000 ? (Math.round(n/1000)/10).toLocaleString('ko-KR')+'만' : Math.round(n).toLocaleString('ko-KR'); // 랭킹 칩 컴팩트 표기
const clampPrice = p => Math.max(MIN_PRICE, Math.min(MAX_PRICE, p));
function movePrice(price, steps){
  // move along PRICE_STEPS grid
  let idx = PRICE_STEPS.indexOf(price);
  if(idx<0){ // nearest
    idx = PRICE_STEPS.reduce((best,v,i)=>Math.abs(v-price)<Math.abs(PRICE_STEPS[best]-price)?i:best,0);
  }
  idx = Math.max(0, Math.min(PRICE_STEPS.length-1, idx+steps));
  return PRICE_STEPS[idx];
}
// 소프트 바닥: 한 번에 0원(상폐)으로 직행하지 않음. 이미 500원이던 회사만 상폐 가능(경고 라운드).
function moveWithFloor(price, steps){
  let after = movePrice(price, steps);
  if(after===0 && price>500) after=500;
  return after;
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// 회사가 살아있는지 확인 (상장폐지=0원 아니면 살아있음)
function isAlive(cid){ return G && G.prices && G.prices[cid] > 0; }

// 이벤트가 살아있는 회사에 영향을 주는지 확인 (모두 죽었으면 의미없음)
function isEventRelevant(ev){
  if(!G || !G.prices) return true; // 게임 시작 전엔 통과
  if(ev.who === 'all'){
    return COMPANIES.some(c=>isAlive(c.id)); // 모든 회사 대상이면 살아있는 게 하나라도 있으면 OK
  }
  return ev.who.some(cid=>isAlive(cid)); // 대상 회사 중 하나라도 살아있으면 OK
}

// draw a pair of DISTINCT, RELEVANT events
function drawPair(deck){
  if(deck.length<2) { const fresh=shuffle([...EVENTS,...EVENTS]); while(fresh.length) deck.push(fresh.pop()); }
  // 살아있는 회사 영향 이벤트만 통과시키기 위해 최대 N번 시도
  const drawOne = ()=>{
    for(let i=0; i<20 && deck.length; i++){
      const card = deck.pop();
      if(isEventRelevant(card)) return card;
      // 무관한 카드(전부 상장폐지된 회사)는 버림
    }
    return null;
  };
  const a = drawOne();
  let b = drawOne();
  if(b && a && b.tx===a.tx && deck.length){ const c=drawOne(); if(c){ deck.push(b); b=c; } }
  return [a,b].filter(Boolean);
}
function netWorth(p, prices){
  let stock=0; COMPANIES.forEach(c=>stock+=p.shares[c.id]*prices[c.id]);
  return p.cash + stock;
}
function stockValue(p, prices){ let s=0; COMPANIES.forEach(c=>s+=p.shares[c.id]*prices[c.id]); return s; }

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}

window.startGame = function(){
  saveNames();
  const np = G.setupCount||3;
  const names = G.setupNames || [];
  const opts = G.setupOpts || PRESETS.normal;
  // 한 턴 행동 수가 기본(2)보다 많으면 시작자금을 그만큼 더 줌 (3행동=×1.5). 줄이진 않음(1·2행동=×1).
  const _apt = opts.actionsPerTurn || DEFAULT_ACTIONS;
  const startCash = Math.round((opts.startCash * Math.max(1, _apt / DEFAULT_ACTIONS)) / 500) * 500;
  const countryKey = G.setupCountry || 'korea';
  // 선택된 나라로 COMPANIES 재구성
  COMPANIES = buildCompanies(countryKey);
  const country = COUNTRIES[countryKey];
  const prices={}; COMPANIES.forEach(c=>prices[c.id]=c.start);
  const priceHist={}; COMPANIES.forEach(c=>priceHist[c.id]=[c.start]); // 라운드별 종가 이력 (차트용)
  const goalDeck = shuffle(GOALS);
  const players=[];
  for(let i=0;i<np;i++){
    const shares={}; COMPANIES.forEach(c=>shares[c.id]=0);
    players.push({
      name: names[i]||`P${i+1}`, av:AVATARS[i],
      cash:startCash, shares, goal:goalDeck[i%goalDeck.length],
      hand:[], insured:{}, dividendCount:0, history:[startCash], _holdStreak:{}, _maxHoldStreak:0
    });
  }
  let actionDeck = shuffle([...ACTIONS, ...ACTIONS]);
  players.forEach(p=>{ p.hand=[actionDeck.pop(), actionDeck.pop()]; });
  // 🎲 시작 순서 무작위 — 아빠가 늘 먼저 하지 않게 (기능 #2). 각자 이름·아바타·목표는 그대로 따라감.
  const seated = shuffle(players);
  let eventDeck = shuffle([...EVENTS, ...EVENTS, ...EVENTS]);
  const forecast = [];
  for(let i=0;i<opts.forecastLen;i++) forecast.push(drawPair(eventDeck));

  G = {
    setupCount:np, setupNames:names, setupOpts:opts, setupCountry:countryKey, country,
    players:seated, prices, prevPrices:{...prices}, priceHist, eventDeck, actionDeck, forecast,
    round:1, turnIdx:0, actionsPerTurn:(opts.actionsPerTurn||DEFAULT_ACTIONS), actionsLeft:(opts.actionsPerTurn||DEFAULT_ACTIONS), buyCountThisTurn:{}, maxBuyThisTurn:opts.buyLimit, baseBuyLimit:opts.buyLimit,
    phase:'pass', infoPeek:null, flipNext:false, lastChanges:{}, lastForecast:null,
    coachMode: opts.coachOn,
    log:{ delisted:[], maxConcentration:{}, divTotals:{}, peakStock:{}, trades:0, startTime:Date.now() }
  };
  players.forEach(p=>{ G.log.divTotals[p.name]=0; G.log.maxConcentration[p.name]=0; });
  showPassScreen();
};

// 행동 직전 상태를 스택에 저장 (각 거래/카드 핸들러가 호출)
function pushUndo(){
  const p = G.players[G.turnIdx];
  (G.undoStack = G.undoStack || []).push({
    cash: p.cash, shares: {...p.shares}, hand: p.hand.map(c=>c), insured: {...p.insured},
    infoPeek: G.infoPeek, flipNext: G.flipNext, maxBuyThisTurn: G.maxBuyThisTurn,
    actionsLeft: G.actionsLeft, buyCountThisTurn: {...G.buyCountThisTurn}
  });
}

// 직전 행동 하나만 되돌리기 (여러 번 누르면 차례로 취소)
window.undoTurn = function(){
  const st = G.undoStack;
  if(!st || !st.length){ toast('되돌릴 행동이 없어요'); return; }
  const snap = st.pop();
  const p = G.players[G.turnIdx];
  p.cash = snap.cash;
  p.shares = {...snap.shares};
  p.hand = snap.hand.map(c=>c);
  p.insured = {...snap.insured};
  G.infoPeek = snap.infoPeek;
  G.flipNext = snap.flipNext;
  G.maxBuyThisTurn = snap.maxBuyThisTurn;
  G.actionsLeft = snap.actionsLeft;
  G.buyCountThisTurn = {...snap.buyCountThisTurn};
  toast('↩️ 한 행동 되돌렸어요');
  renderTurn();
};

// 슬롯의 사건 목록을 렌더 (고급이면 index1 방향 숨김)
function slotEvsHTML(slot){
  const fog = !!(G.setupOpts && G.setupOpts.forecastFog);
  return slot.map((ev,i)=>miniEvHTML(ev, fog && i===1)).join('');
}
// 예보 슬롯 릴 — 지난(흐릿) · 이번(payline·환함) · 다음 · 다다음(초급)
function reelRowHTML(slot, kind, label, opts){
  opts = opts || {};
  const fog = !!opts.fog;
  const evs = slot.map((ev,i)=>miniEvHTML(ev, fog && i===1)).join('');
  return `<div class="fcrow r-${kind}${opts.lit?' lit':''}" onclick="reelTap(this)">
    <div class="fc-rlabel">${label}</div>
    <div class="fc-rbody">${evs}</div>
  </div>`;
}
function reelHiddenHTML(kind, label, note){
  return `<div class="fcrow r-${kind} fc-hidden" onclick="reelTap(this)">
    <div class="fc-rlabel">${label}</div>
    <div class="fc-rbody"><span class="fc-qm">❓</span><span class="fc-qtx">${note}</span></div>
  </div>`;

function fcReelHTML(){
  const isLast = G.round===TOTAL_ROUNDS;
  const len = G.forecast.length; // 현재 로드된 예보 슬롯 수 = 난이도별 forecastLen
  const fog = !!(G.setupOpts && G.setupOpts.forecastFog);
  const rows = [];
  // 지난 라운드 (직전 1R) — 2라운드부터 존재
  if(G.lastForecast) rows.push(reelRowHTML(G.lastForecast, 'past', '◀ 지난 라운드', {}));
  // 이번 라운드 — payline, 기본 포커스
  rows.push(reelRowHTML(G.forecast[0], 'cur', '<span class="fc-livedot"></span>지금 · 이번 라운드 사건 2개', {fog, lit:true}));
  // 다음 라운드 — 예보 길이 2 이상이고 마지막 라운드 아닐 때만 공개
  if(!isLast && len>=2 && G.forecast[1]){
    rows.push(reelRowHTML(G.forecast[1], 'next', '다음 라운드 ▾', {fog}));
  } else {
    rows.push(reelHiddenHTML('next', '다음 라운드 ▾', isLast?'마지막 라운드 — 비공개':'고급 모드 — 비공개'));
  }
  // 다다음 (초급: 예보 길이 3) — 데이터 있을 때만, 가장 흐릿
  if(!isLast && len>=3 && G.forecast[2]){
    rows.push(reelRowHTML(G.forecast[2], 'soon', '다다음 라운드 ▾', {fog}));
  }
  return `<div class="fcreel-wrap">
    <div class="fcreel" id="fcreel">${rows.join('')}</div>
  </div>`;
}
// 릴 조작: 기본은 '이번'을 위쪽에 고정(지난은 위로 살짝 굴려 보기). 흐릿한 칸을 탭하면 그 칸을 위로.
window.reelTap = function(row){

function setupReel(){
  const reel = document.getElementById('fcreel');
  if(!reel) return;
  const cur = reel.querySelector('.fcrow.r-cur');
  if(!cur) return;
  // '이번' 칸을 위쪽에 붙이되, 위에 지난 뉴스가 살짝 보이게(roll-up 힌트) 16px 남김
  requestAnimationFrame(()=>{ reel.scrollTo({ top: Math.max(0, cur.offsetTop - 16), behavior:'auto' }); });
}

window.toggleHand = function(){ const t=$('#handTray'); if(t) t.style.display = (t.style.display==='none'?'block':'none'); };
// 거래 피드백: 타일 팝 + 동전 비행 + 마스코트 반응 (renderTurn 이후 호출 → 새 DOM 대상)
function tileFx(cid, dir){
  const tile=$('#tile-'+cid); if(tile){
    tile.classList.add(dir>0?'flash-up':'flash-down');
    const r=tile.getBoundingClientRect();
    // 🪙 동전 버스트: 여러 개가 팡 튀어오름(매수=금화, 매도=지폐)
    coinShower(r.left+r.width/2, r.top+8, dir>0?5:3, dir>0?'🪙':'💸');
  }
  const m=$(dir>0?'#bull':'#bear'); if(m){ m.classList.add(dir>0?'cheer':'boo'); }
}
// 동전이 한 지점에서 부채꼴로 팡 튀는 연출 (transform/opacity)
function coinShower(x, y, n, glyph){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) n=Math.min(n,1);
  glyph=glyph||'🪙';
  for(let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='coin'; c.textContent=glyph;
    const dx=(i-(n-1)/2)*22 + (i*7%11-5);
    c.style.left=(x-13)+'px'; c.style.top=y+'px';
    c.style.setProperty('--cdx', dx+'px');
    c.style.animationDelay=(i*55)+'ms';
    document.body.appendChild(c); setTimeout(()=>c.remove(),900+i*55);
  }
}
function confettiBurst(n){
  const cols=['#ffd23f','#5dd39e','#ff7a85','#6db3ff','#c79bff','#ffb061'];
  for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='confetti';
    d.style.left=Math.random()*100+'vw'; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.6+Math.random()*1.5)+'s'; d.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),3600); }
}

// ---------- TRADE ACTIONS ----------
window.buy = function(cid){
  const p=G.players[G.turnIdx]; const pr=G.prices[cid];
  if(G.actionsLeft<=0||pr<=0||p.cash<pr) return;
  const bought=G.buyCountThisTurn[cid]||0;
  if(bought>=G.maxBuyThisTurn){ toast('이번 턴 이 회사는 더 못 사요'); return; }
  if(p.shares[cid]>=MAX_SHARES){ toast(`한 회사 최대 ${MAX_SHARES}주까지!`); return; }
  pushUndo();
  p.cash-=pr; p.shares[cid]++; G.buyCountThisTurn[cid]=bought+1;
  G.actionsLeft--;
  renderTurn(); tileFx(cid, 1);
};
window.sell = function(cid){
  const p=G.players[G.turnIdx]; const pr=G.prices[cid];
  if(G.actionsLeft<=0||p.shares[cid]<=0) return;
  pushUndo();
  let price=pr;
  if(p.insured[cid]){ // insurance: guarantee buy price -> use max(current, insuredPrice)
    price=Math.max(pr, p.insured[cid]); delete p.insured[cid]; toast('🛡️ 보험 적용! 산 가격 보장');
  }
  p.cash+=price; p.shares[cid]--;
  G.actionsLeft--;
  renderTurn(); tileFx(cid, -1);
};

window.doPass = function(){
  const p=G.players[G.turnIdx];
  if(G.actionsLeft<=0) return;
  pushUndo();
  p.cash+=500; G.actionsLeft--;
  toast('💰 +500원');
  renderTurn();
};

window.drawCard = function(){
  const p=G.players[G.turnIdx];
  if(G.actionsLeft<=0) return;
  pushUndo();
  if(!G.actionDeck.length) G.actionDeck=shuffle([...ACTIONS,...ACTIONS]);
  p.hand.push(G.actionDeck.pop());
  G.actionsLeft--;
  toast('🎴 카드를 뽑았어요');
  renderTurn();
};

// ---------- ACTION CARDS ----------
window.useCard = function(i){
  const p=G.players[G.turnIdx]; const card=p.hand[i];
  if(!card) return;
  if(card.id!=='extra' && G.actionsLeft<=0) return;
  pushUndo();

  switch(card.id){
    case 'extra':
      G.actionsLeft++; p.hand.splice(i,1); toast('⚡ 행동 +1!'); renderTurn(); return;
    case 'cash':
      p.cash+=3000; G.maxBuyThisTurn=5; p.hand.splice(i,1); G.actionsLeft--;
      toast('💰 +3,000원 · 5주 매수 가능!'); renderTurn(); return;
    case 'div': {
      let total=0; COMPANIES.forEach(c=>total+=p.shares[c.id]*100);
      p.cash+=total; p.hand.splice(i,1); G.actionsLeft--;
      toast(`🎁 특별배당 +${won(total)}`); renderTurn(); return;
    }
    case 'flip':
      G.flipNext=true; p.hand.splice(i,1); G.actionsLeft--;
      toast('🔁 이번 이벤트 효과가 반대로!'); renderTurn(); return;
    case 'info': {
      // peek the card after next (3rd) - we peek eventDeck top
      const peek = G.eventDeck[G.eventDeck.length-1];
      G.infoPeek = peek ? (peek.who==='all'?'모든 회사':peek.who.map(id=>COMPANIES.find(c=>c.id===id).nm).join('·')) : '알 수 없음';
      p.hand.splice(i,1); G.actionsLeft--; renderTurn(); return;
    }
    case 'cut':
      chooseStock('손절매 — 어느 회사를 전부 팔까요?', (cid)=>{
        const pr=G.prices[cid]; const n=p.shares[cid];
        if(n<=0){ toast('가진 주식이 없어요'); return; }
        p.cash+=pr*n; p.shares[cid]=0; p.hand.splice(i,1); G.actionsLeft--;
        toast(`✂️ ${COMPANIES.find(c=>c.id===cid).nm} ${n}주 매도`); renderTurn();
      }, (cid)=>p.shares[cid]>0); return;
    case 'avg':
      chooseStock('물타기 — 어느 회사를 싸게 살까요?', (cid)=>{
        const pr=Math.max(0,G.prices[cid]-200);
        if(p.cash<pr){ toast('현금이 부족해요'); return; }
        if(p.shares[cid]>=MAX_SHARES){ toast('8주 상한!'); return; }
        p.cash-=pr; p.shares[cid]++; p.hand.splice(i,1); G.actionsLeft--;
        toast(`💧 ${COMPANIES.find(c=>c.id===cid).nm} 200원 싸게 매수`); renderTurn();
      }, (cid)=>p.shares[cid]>0); return;
    case 'ins':
      chooseStock('보험가입 — 어느 회사 주식을 보호할까요?', (cid)=>{
        if(p.shares[cid]<=0){ toast('가진 주식이 없어요'); return; }
        p.insured[cid]=G.prices[cid]; p.hand.splice(i,1); G.actionsLeft--;
        toast(`🛡️ ${COMPANIES.find(c=>c.id===cid).nm} 보험 가입 (${won(G.prices[cid])} 보장)`); renderTurn();
      }, (cid)=>p.shares[cid]>0); return;
  }
};

// ---------- 가격 차트 + 배당 안내 모달 ----------
window.showChart = function(cid){
  const c = COMPANIES.find(x=>x.id===cid); if(!c) return;
  const p = G.players[G.turnIdx];
  const hist = (G.priceHist && G.priceHist[cid] && G.priceHist[cid].length) ? G.priceHist[cid] : [G.prices[cid]];
  const own = p.shares[cid]||0;
  const cur = G.prices[cid];
  // SVG 좌표계
  const W=320,H=172, padL=40,padR=14,padT=16,padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n=hist.length;
  const xAt=i=> n<=1 ? padL+plotW/2 : padL + (i/(n-1))*plotW;
  const yAt=v=> padT + (1 - Math.min(v,MAX_PRICE)/MAX_PRICE)*plotH;
  const pts=hist.map((v,i)=>`${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
  const rising = hist[n-1] >= hist[0];
  const lineCol = rising ? 'var(--up-ink)' : 'var(--down-ink)';
  const grid=[0,2750,5500].map(v=>`<line x1="${padL}" y1="${yAt(v).toFixed(1)}" x2="${W-padR}" y2="${yAt(v).toFixed(1)}" stroke="oklch(0.86 0.02 250)" stroke-width="1" stroke-dasharray="3 3"/><text x="${padL-5}" y="${(yAt(v)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#999">${v.toLocaleString('ko-KR')}</text>`).join('');
  const step = n>8?2:1;
  let xlabels='';
  for(let i=0;i<n;i+=step){ xlabels+=`<text x="${xAt(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#999">${i===0?'시작':i+'R'}</text>`; }
  const dots=hist.map((v,i)=>`<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(v).toFixed(1)}" r="${i===n-1?4:2.4}" fill="${i===n-1?lineCol:'#fff'}" stroke="${lineCol}" stroke-width="1.5"/>`).join('');
  const lastLabel = `<text x="${xAt(n-1).toFixed(1)}" y="${(yAt(hist[n-1])-9).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="900" fill="${lineCol}">${won(hist[n-1])}</text>`;

  const divEvery = (G.setupOpts&&G.setupOpts.divEvery)||1;
  let divHTML;
  if(c.div<=0){
    divHTML = `<div class="ch-div none"><b>${c.ico} ${c.nm}는 배당이 없어요.</b><br>대신 주가가 오르길 노리는 <b>성장주</b>예요. (용돈 X, 시세 차익 O)</div>`;
  } else {
    const mine = own>0
      ? `<br>지금 <b>${own}주</b> 가지고 있으니 배당 때마다 약 <b style="color:var(--gold-deep)">${won(own*c.div)}</b> 받아요.`
      : `<br>아직 안 가졌어요. 1주 사면 배당 때마다 <b>${won(c.div)}</b>.`;
    divHTML = `<div class="ch-div"><b>💰 배당(가만히 받는 용돈)</b><br>주당 <b>${won(c.div)}</b> · <b>${divEvery===1?'매 라운드':divEvery+'라운드마다'}</b> 지급${mine}<div class="ch-div-note">※ 배당은 사건(증배·감배·중단)으로 그 라운드만 변할 수 있어요.</div></div>`;
  }

  const ov=document.createElement('div'); ov.className='overlay'; ov.id='chartOv';
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
  ov.innerHTML = `<div class="modal chart-modal">
    <div class="ch-head"><span class="ch-ico">${c.ico}</span><span class="ch-nm">${c.nm}</span>
      <span class="ch-cur num" style="color:${lineCol}">${cur===0?'💀 상장폐지':won(cur)}</span></div>
    <div class="ch-sub">라운드별 가격 변화 · 천장 ${won(MAX_PRICE)} · 0원=상장폐지</div>
    <svg viewBox="0 0 ${W} ${H}" class="ch-svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${c.nm} 가격 차트">
      ${grid}
      <polyline points="${pts}" fill="none" stroke="${lineCol}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${lastLabel}${xlabels}
    </svg>
    ${divHTML}
    <button class="mbtn" onclick="this.closest('.overlay').remove()">닫기</button>
  </div>`;
  document.body.appendChild(ov);
};

// ---------- END TURN ----------
window.endTurn = function(){
  // next player or resolve round
  G.turnIdx++;
  if(G.turnIdx>=G.players.length){
    G.turnIdx=0;
    resolveRound();
  } else {
    showPassScreen();
  }
};

// ---------- 나라 시그니처 step 계산 (시뮬레이터와 동일) ----------
function computeSteps(ev, G){
  let steps = G.flipNext ? -ev.steps : ev.steps;
  if(steps === 0) return 0;
  const sig = G.country.sig || {};
  // 한국: 세계경기(all) 증폭
  if(ev.who==='all' && sig.worldAmplify) steps += Math.sign(steps);
  // 한국: tech/auto 호재 강세
  if(Array.isArray(ev.who) && sig.sectorBoost && steps>0 && ev.who.some(w=>sig.sectorBoost.includes(w))) steps += 1;
  // 대만: tech 사건 증폭(양방향)
  if(Array.isArray(ev.who) && sig.techAmplify && ev.who.includes('tech')) steps += Math.sign(steps);
  // 나라 변동성
  if(steps>0) steps = Math.max(1, steps + G.country.volMod);
  else        steps = Math.min(-1, steps - G.country.volMod);
  // 초급: 하락 완충
  if(steps<0) steps = Math.min(-1, steps + (G.setupOpts.downsideBuffer||0));
  // 일본: 큰 사건 압축
  if(sig.compressBig && Math.abs(steps)>=2) steps = Math.sign(steps);
  return steps;
}

// 레버 A — 만능 깜짝사건(예보에 없는 충격). 위험국일수록 swanChance↑
function maybeBlackSwan(G){
  const chance = G.country.swanChance || 0;
  if(Math.random() >= chance) return null;
  const alive = COMPANIES.filter(c=>G.prices[c.id]>0);
  if(!alive.length) return null;
  const victim = alive[Math.floor(Math.random()*alive.length)];
  const before = G.prices[victim.id];
  G.prices[victim.id] = moveWithFloor(before, -(G.country.swanSteps||2));
  return { cid:victim.id, before, after:G.prices[victim.id] };
}

// 인도 성장 드리프트 — 매 라운드 확률적으로 살아있는 전 종목 +1
function applyGrowthDrift(G){
  const sig = G.country.sig||{};
  if(!sig.growthDrift || Math.random() >= sig.growthDrift) return [];
  const out=[];
  COMPANIES.forEach(c=>{ if(G.prices[c.id]>0 && G.prices[c.id]<MAX_PRICE){ const before=G.prices[c.id]; G.prices[c.id]=movePrice(before,1); out.push({cid:c.id,before,after:G.prices[c.id]}); } });
  return out;
}

// ---------- RESOLVE ROUND (execute BOTH forecast events, dividends, advance) ----------
function resolveRound(){
  const events=G.forecast[0]; // array of up to 2 events
  G.prevPrices={...G.prices};
  const changes=[];
  const flip = G.flipNext; // computeSteps reads G.flipNext; reset after the events loop

  // dividend multipliers for THIS round (default 1)
  const divMul={}; COMPANIES.forEach(c=>divMul[c.id]=1);
  const divEvents=[];

  events.forEach(ev=>{
    if(ev.kind==='div'){
      // dividend event: no price move, set multiplier
      const targets = ev.who==='all' ? COMPANIES.map(c=>c.id) : ev.who;
      targets.forEach(cid=>{ divMul[cid] = ev.divMul; });
      divEvents.push(ev);
      return;
    }
    const steps = computeSteps(ev, G);
    if(steps===0) return;
    const applyTo = ev.who==='all' ? COMPANIES.map(c=>c.id) : ev.who;
    const marketWide = ev.who==='all'; // 시장 전체 악재로는 상장폐지 금지(500원에서 막힘) — 떼상폐 방지
    applyTo.forEach(cid=>{
      if(G.prices[cid]<=0) return;
      const before=G.prices[cid];
      let after=moveWithFloor(G.prices[cid], steps);
      if(marketWide && after===0) after=500; // 개별 악재·깜짝사건만 0원(상폐) 가능
      G.prices[cid]=after;
      changes.push({cid, before, after:G.prices[cid], evIco:ev.ico, evTx:ev.tx});
    });
    if(ev.chain && ev.who!=='all'){
      const cid=ev.chain.who; let cs=flip?-ev.chain.steps:ev.chain.steps;
      if(G.prices[cid]>0){
        const before=G.prices[cid];
        G.prices[cid]=moveWithFloor(G.prices[cid], cs);
        changes.push({cid, before, after:G.prices[cid], chain:true, evIco:ev.ico, evTx:ev.tx});
      }
    }
  });
  G.flipNext=false; // 이번 라운드 뒤집기 효과 사용 완료

  // 인도 성장 드리프트
  applyGrowthDrift(G).forEach(ch=>changes.push({...ch, drift:true}));
  // 레버 A 블랙스완 (예보에 없는 깜짝 충격)
  const swan = maybeBlackSwan(G);
  if(swan){ changes.push({...swan, swan:true}); }

  // dividends (with this round's multipliers) — only on divEvery rounds
  const divPaid=[];
  const divThisRound = (G.round % G.setupOpts.divEvery === 0);
  G.players.forEach(p=>{
    let total=0;
    if(divThisRound){
      COMPANIES.forEach(c=>{ if(p.shares[c.id]>0 && c.div>0 && G.prices[c.id]>0){ total+=Math.round(p.shares[c.id]*c.div*divMul[c.id]); } });
      const distinct = COMPANIES.filter(c=>p.shares[c.id]>0).length;
      if(distinct>=4) total += DIVERSIFY_BONUS; // 레버 C — 4종↑ 분산 보너스
    }
    if(total>0){ p.cash+=total; p.dividendCount++; G.log.divTotals[p.name]+=total; }
    divPaid.push({name:p.name, av:p.av, amount:total});
  });

  // track delisting + concentration
  changes.forEach(ch=>{
    if(ch.after===0){
      const c=COMPANIES.find(x=>x.id===ch.cid);
      G.players.forEach(p=>{ if(p.shares[ch.cid]>0 && !G.log.delisted.find(d=>d.cid===ch.cid)){ G.log.delisted.push({cid:ch.cid, nm:c.nm, ico:c.ico, victim:p.name}); } });
    }
  });
  G.players.forEach(p=>{
    const maxShare=Math.max(...COMPANIES.map(c=>p.shares[c.id]*G.prices[c.id]));
    const totalStock=stockValue(p,G.prices);
    if(totalStock>0){ const conc=maxShare/totalStock; if(conc>G.log.maxConcentration[p.name]) G.log.maxConcentration[p.name]=conc; }
  });

  // record net worth history
  G.players.forEach(p=> p.history.push(netWorth(p,G.prices)) );
  // record per-company price history (차트용) — 이번 라운드 종가
  COMPANIES.forEach(c=>{ (G.priceHist[c.id]=G.priceHist[c.id]||[]).push(G.prices[c.id]); });
  // 장기 보유 추적 (목표카드 '장기 투자자') — 안 팔고 연속 보유한 라운드 수
  G.players.forEach(p=>{
    p._holdStreak=p._holdStreak||{}; let best=p._maxHoldStreak||0;
    COMPANIES.forEach(c=>{ if(p.shares[c.id]>0){ p._holdStreak[c.id]=(p._holdStreak[c.id]||0)+1; if(p._holdStreak[c.id]>best)best=p._holdStreak[c.id]; } else p._holdStreak[c.id]=0; });
    p._maxHoldStreak=best;
  });

  // 상장폐지 회사가 있으면, 예보 칸에서 그 회사 관련 이벤트 제거 & 새 카드로 교체
  const justDelisted = changes.filter(ch=>ch.after===0).map(ch=>ch.cid);
  if(justDelisted.length){
    for(let i=0; i<G.forecast.length; i++){
      G.forecast[i] = G.forecast[i].filter(ev=>{
        if(ev.who==='all') return true; // 모든 회사 이벤트는 살아있는 회사 있으면 유효
        return ev.who.some(cid=>isAlive(cid)); // 대상 중 살아있는 회사 있으면 유지
      });
      // 사건 2개가 안 되면 새로 뽑아 채움
      while(G.forecast[i].length < 2){
        const fresh = drawPair(G.eventDeck);
        if(fresh.length===0) break;
        G.forecast[i].push(fresh[0]);
        if(G.forecast[i].length < 2 && fresh[1]) G.forecast[i].push(fresh[1]);
      }
    }
  }

  G.lastChanges={events, flip, changes, divPaid, divEvents, justDelisted, round:G.round};
  showEventReveal();
}

// review=true → '지난 라운드 결과 다시 보기'(닫기 버튼). 기본=라운드 직후 결산(다음 라운드로).
function showEventReveal(review){
  const {events, changes, divPaid, divEvents}=G.lastChanges;
  const shownRound = G.lastChanges.round || G.round;   // 결산이 속한 라운드(리뷰 시 G.round는 이미 +1됨)
  const isLast = shownRound===TOTAL_ROUNDS && !review;

  // ranking with delta from previous round
  const ranked=G.players.map((p,idx)=>{
    const nw=p.history[p.history.length-1];
    const prev=p.history.length>=2?p.history[p.history.length-2]:nw;
    return {p, nw, delta:nw-prev, idx};
  }).sort((a,b)=>b.nw-a.nw);
  const medals=['🥇','🥈','🥉','4️⃣'];

  const evCardHTML = ev => {
    if(ev.kind==='div'){
      const who = ev.who==='all'?'모든 회사':ev.who.map(id=>COMPANIES.find(c=>c.id===id).nm).join('·');
      const label = ev.divMul===0?'배당 없음':ev.divMul<1?'배당 줄어요':'배당 늘어요';
      return `<div class="ev-one divev">
        <div class="eo-ico">${ev.ico}</div>
        <div class="eo-tx">${ev.tx}</div>
        <div class="eo-ef">${who} · ${label}</div>
      </div>`;
    }
    const e=evShort(ev);
    return `<div class="ev-one ${ev.steps>0?'up':'down'}">
      <div class="eo-ico">${ev.ico}</div>
      <div class="eo-tx">${ev.tx}</div>
      <div class="eo-ef">${e.who} ${ev.steps>0?'▲':'▼'}${Math.abs(ev.steps)}칸</div>
    </div>`;
  };

  $('#app').innerHTML = `
    <div class="overlay">
      <div class="modal event-reveal" style="max-width:460px;">
        <div style="font-size:13px;opacity:.7;margin-bottom:6px;">${review?`📔 지난 ${shownRound}라운드 결과 (다시 보기)`:`${shownRound}라운드 결과`}</div>
        <div class="ev-pair">
          ${events.map(evCardHTML).join('')}
        </div>

        ${(()=>{ const swans=changes.filter(ch=>ch.swan); if(!swans.length) return '';
          return `<div class="swan-banner">
            <div class="sb-h">❗깜짝 사건! 아무도 몰랐던 일이 터졌어요</div>
            ${swans.map(ch=>{ const c=COMPANIES.find(x=>x.id===ch.cid);
              return `<div class="sb-row"><span>${c.ico} ${c.nm}</span><span class="down">${won(ch.before)} → ${won(ch.after)}${ch.after===0?' 💀':''}</span></div>`;
            }).join('')}
          </div>`; })()}

        ${changes.some(ch=>ch.drift)?`<div class="drift-note">🌱 천천히 자랐어요 — 회사들이 조금씩 올랐어요.</div>`:''}

        ${changes.length?`<div class="ev-detail">
          <div style="font-weight:700;margin-bottom:4px;font-size:12px;">📊 주가 변동</div>
          ${changes.map(ch=>{
            const c=COMPANIES.find(x=>x.id===ch.cid);
            const diff=ch.after-ch.before;
            const tag = ch.swan?' ❗':ch.drift?' 🌱':ch.chain?' (연동)':'';
            return `<div class="row"><span>${c.ico} ${c.nm}${tag}</span>
              <span class="${diff>=0?'up':'down'}">${won(ch.before)} → ${won(ch.after)}${ch.after===0?' 💀':''}</span></div>`;
          }).join('')}
        </div>`:''}

        ${divEvents&&divEvents.length?`<div class="ev-detail" style="border:1px solid #ffd23f;">
          <div style="font-weight:700;margin-bottom:4px;font-size:12px;color:#ffd23f;">🎁 이번 라운드 배당 변동!</div>
          ${divEvents.map(ev=>{
            const who = ev.who==='all'?'모든 회사':ev.who.map(id=>COMPANIES.find(c=>c.id===id).nm).join('·');
            const label = ev.divMul===0?'이번 배당 없음 🚫':ev.divMul<1?`배당 ${ev.divMul}배로 줄어요`:`배당 ${ev.divMul}배로 늘어요!`;
            return `<div class="row"><span>${ev.ico} ${who}</span><span class="${ev.divMul>=1?'up':'down'}">${label}</span></div>`;
          }).join('')}
        </div>`:''}

        <div class="ev-detail">
          <div style="font-weight:700;margin-bottom:4px;font-size:12px;">🏆 자산 순위 (지난 라운드 대비)</div>
          ${ranked.map((r,i)=>`<div class="row rank-row">
            <span>${medals[i]} ${r.p.av} ${r.p.name}</span>
            <span>${won(r.nw)} <span class="delta ${r.delta>=0?'up':'down'}">${r.delta>=0?'▲':'▼'}${won(Math.abs(r.delta))}</span></span>
          </div>`).join('')}
        </div>

        <div class="ev-detail">
          <div style="font-weight:700;margin-bottom:4px;font-size:12px;">💰 배당금 ${G.setupOpts.divEvery>1?`(${G.setupOpts.divEvery}라운드마다 지급)`:''}</div>
          ${(shownRound % G.setupOpts.divEvery !== 0) ? `<div style="text-align:center;opacity:.6;font-size:12px;padding:4px;">이번 라운드는 배당이 없어요. 다음 배당까지 ${G.setupOpts.divEvery - (shownRound % G.setupOpts.divEvery)}라운드 남았어요.</div>` :
            divPaid.map(d=>`<div class="row"><span>${d.av} ${d.name}</span><span class="${d.amount>0?'up':''}">${d.amount>0?'+'+won(d.amount):'-'}</span></div>`).join('')
          }
        </div>

        <button class="mbtn" onclick="${review?'closeReview()':'advanceRound()'}">${review?'닫기':(isLast?'🏁 최종 결과 보기':`${shownRound+1}라운드로 ▶`)}</button>
      </div>
    </div>`;
  // 🪙 배당이 지급된 라운드면 동전 샤워(다시 보기에선 생략)
  if(!review && divPaid && divPaid.some(d=>d.amount>0)){
    setTimeout(()=>coinShower(innerWidth/2, innerHeight*0.6, 8, '🪙'), 280);
  }
}

// 지난 라운드 결과 다시 보기 (pass-and-play에서 마지막 턴 사람만 보던 결산을 누구나 다시) — 기능 #1
window.viewLastRound = function(){ if(G && G.lastChanges && G.lastChanges.changes) showEventReveal(true); };
window.closeReview = function(){ if(G.phase==='turn') render(); else showPassScreen(); };

window.advanceRound = function(){
  if(G.round>=TOTAL_ROUNDS){ showResults(); return; }
  // 방금 끝난 라운드 예보를 '지난 뉴스'로 보관 (릴 위쪽 peek)
  G.lastForecast = G.forecast[0];
  // shift forecast slots forward, draw a new one at the end
  G.forecast.shift();
  G.forecast.push(drawPair(G.eventDeck));
  G.infoPeek=null;
  G.round++;
  G.turnIdx=0;
  showPassScreen();
};

// ---------- INSIGHT GENERATION ----------
function generateInsights(ranked){
  const ins=[];
  const winner=ranked[0];
  const loser=ranked[ranked.length-1];

  // 1. winner strategy
  const wConc=G.log.maxConcentration[winner.p.name]||0;
  if(wConc>=0.7){
    ins.push({ico:'🎯', title:'집중 투자가 통한 판', text:`${winner.p.name}님은 한 회사에 크게 투자해서 이겼어요. 운이 좋으면 크게 벌 수 있지만, 진짜 주식에서는 그 회사가 어려워지면 한 번에 잃을 수도 있어요. 게임이 짧아서 통한 거예요.`});
  } else if(wConc<=0.45){
    ins.push({ico:'🌈', title:'분산투자의 승리', text:`${winner.p.name}님은 여러 회사에 골고루 나눠 투자해서 이겼어요. 한 회사가 떨어져도 다른 회사가 받쳐줬죠. "계란을 한 바구니에 담지 마라"가 통한 거예요.`});
  }

  // 2. dividend
  const divEntries=Object.entries(G.log.divTotals).sort((a,b)=>b[1]-a[1]);
  if(divEntries[0] && divEntries[0][1]>=8000){
    const dividNames=COMPANIES.filter(c=>c.type==='divid').map(c=>c.nm).join('·');
    ins.push({ico:'🎁', title:'배당의 힘', text:`${divEntries[0][0]}님은 배당금만 ${won(divEntries[0][1])}을 받았어요! 주식을 팔지 않고 가지고만 있어도 돈이 들어오는 게 배당이에요. 배당을 잘 주는 안정적인 회사(${dividNames})를 모은 보람이죠.`});
  }

  // 3. delisting
  if(G.log.delisted.length){
    const d=G.log.delisted[0];
    ins.push({ico:'💀', title:'상장폐지를 겪었어요', text:`${d.ico} ${d.nm} 회사가 주가 0원이 되어 사라졌어요(상장폐지). ${d.victim}님이 그 주식을 가지고 있었다면 휴지가 됐죠. 이래서 한 회사에 다 걸면 위험하고, 나눠 투자하는 게 안전해요.`});
  }

  // 4. close vs blowout
  const gap=winner.total-loser.total;
  if(gap<=5000){
    ins.push({ico:'🤝', title:'손에 땀을 쥔 접전!', text:`1등과 꼴찌 차이가 ${won(gap)}밖에 안 났어요. 모두가 비슷하게 잘했다는 뜻이에요. 다음엔 누가 이길까요?`});
  } else if(gap>=20000){
    ins.push({ico:'🚀', title:'큰 점수 차가 난 판', text:`점수 차이가 ${won(gap)}이나 났어요. ${winner.p.name}님의 어떤 선택이 이렇게 큰 차이를 만들었을까요? 함께 되돌아보면 좋아요.`});
  }

  // 5. goal achievement
  const metGoals=ranked.filter(r=>r.goalMet);
  if(metGoals.length){
    ins.push({ico:'🏅', title:'목표를 이룬 사람', text:`${metGoals.map(r=>r.p.name).join(', ')}님이 비밀 목표를 달성해 보너스를 받았어요. 투자에서도 "왜 투자하는지" 목표를 정하면 흔들리지 않아요.`});
  }

  // 6. always-on reminder
  ins.push({ico:'🌍', title:'기억해요', text:`이 게임에서는 예보로 앞날을 봤지만, 진짜 주식 시장에서는 아무도 내일을 알 수 없어요. 그래서 나눠 사고, 오래 기다리고, "무조건 오른다"는 말은 믿지 않는 거예요.`});

  // 7. dividend changes reminder
  ins.push({ico:'🎁', title:'배당도 변해요', text:`회사가 돈을 잘 벌면 배당을 늘리고(증배), 어려우면 줄이거나 안 주기도 해요(감배·중단). 주가만 보지 말고, 그 회사가 배당을 잘 주는지도 살펴보는 게 진짜 투자자랍니다.`});

  return ins;
}

// ---------- SAVE / LOAD HISTORY ----------
function saveGameRecord(ranked, insights){
  try{
    let list=[];
    try{ const raw=localStorage.getItem('game-history'); if(raw) list=JSON.parse(raw); }catch(e){}
    const rec={
      date:new Date().toLocaleDateString('ko-KR'),
      time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),
      players:ranked.map(r=>({name:r.p.name, av:r.p.av, total:r.total, goalMet:r.goalMet})),
      winner:ranked[0].p.name,
      gap:ranked[0].total-ranked[ranked.length-1].total,
      insightTitles:insights.map(i=>i.title)
    };
    list.unshift(rec);
    if(list.length>50) list=list.slice(0,50);
    localStorage.setItem('game-history', JSON.stringify(list));
    return true;
  }catch(e){ return false; }
}

function showResults(){
  const ranked=G.players.map(p=>{
    const base=netWorth(p,G.prices);
    const goalMet=p.goal.check(p,G);
    const bonus=goalMet?p.goal.reward:0;
    return {p, base, goalMet, bonus, total:base+bonus, sv:stockValue(p,G.prices)};
  }).sort((a,b)=>b.total-a.total);

  const insights=generateInsights(ranked);
  saveGameRecord(ranked, insights); // fire and forget
  confettiBurst(110); // 🎉 우승 축하 연출

  const medals=['🥇','🥈','🥉','4️⃣'];
  $('#app').innerHTML = `
    <div class="results">
      <h1>🏆 게임 종료!</h1>
      <div class="sub">12라운드 최종 결과</div>
      ${ranked.map((r,i)=>`
        <div class="rank ${i===0?'win':''}">
          <span class="medal">${medals[i]}</span>
          <div class="info">
            <div class="n">${r.p.av} ${r.p.name}</div>
            <div class="breakdown">현금 ${won(r.p.cash)} · 주식 ${won(r.sv)} ${r.goalMet?`· 🎯${r.p.goal.nm} +${won(r.bonus)}`:`· 목표 미달성`}</div>
          </div>
          <div class="total">${won(r.total)}</div>
        </div>
      `).join('')}

      <div class="insights">
        <h2>📚 오늘의 배울 점</h2>
        ${insights.map(i=>`<div class="insight"><span class="in-ico">${i.ico}</span><div><div class="in-title">${i.title}</div><div class="in-text">${i.text}</div></div></div>`).join('')}
      </div>

      <div style="display:flex;gap:8px;margin-top:20px;">
        <button class="act-pass" style="flex:1;padding:15px;" onclick="showHistory()">📊 지난 기록</button>
        <button class="start-btn" style="flex:1;margin-top:0;" onclick="renderSetup()">🔄 다시 하기</button>
      </div>
      <div class="hint-tip" style="margin-top:16px;">💡 가족과 이야기 나눠보세요: "왜 그 회사를 샀어?", "예보를 보고 어떻게 판단했어?", "한 곳에 몰빵 vs 나누기, 뭐가 좋았을까?"</div>
    </div>`;
}

// ---------- HISTORY SCREEN ----------
window.showHistory = function(){
  let list=[];
  try{ const raw=localStorage.getItem('game-history'); if(raw) list=JSON.parse(raw); }catch(e){}

  // aggregate stats
  const winCount={};
  list.forEach(rec=>{ winCount[rec.winner]=(winCount[rec.winner]||0)+1; });
  const winners=Object.entries(winCount).sort((a,b)=>b[1]-a[1]);

  $('#app').innerHTML = `
    <div class="results">
      <h1>📊 게임 기록</h1>
      <div class="sub">지금까지 ${list.length}판을 플레이했어요</div>
      ${list.length===0? `<div style="text-align:center;opacity:.6;padding:40px 20px;">아직 기록이 없어요.<br>게임을 한 판 끝내면 여기에 쌓여요!</div>` : `
        ${winners.length? `<div class="stat-box"><div class="sb-title">🏆 누가 많이 이겼나</div>
          ${winners.map(([n,c])=>`<div class="sb-row"><span>${n}</span><span><b>${c}</b>승</span></div>`).join('')}
        </div>`:''}
        <div class="stat-box"><div class="sb-title">📅 최근 게임들</div>
          ${list.slice(0,15).map(rec=>`
            <div class="hist-game">
              <div class="hg-head"><span>${rec.date} ${rec.time}</span><span class="hg-win">🥇 ${rec.winner}</span></div>
              <div class="hg-players">${rec.players.map((p,i)=>`${['🥇','🥈','🥉','4️⃣'][i]}${p.av}${p.name} ${won(p.total)}`).join('  ·  ')}</div>
              ${rec.insightTitles&&rec.insightTitles.length?`<div class="hg-ins">📚 ${rec.insightTitles.slice(0,3).join(' / ')}</div>`:''}
            </div>
          `).join('')}
        </div>
        <button class="act-pass" style="width:100%;padding:12px;margin-top:10px;font-size:13px;" onclick="clearHistory()">🗑️ 기록 모두 지우기</button>
      `}
      <button class="start-btn" style="max-width:100%;margin-top:16px;" onclick="renderSetup()">🏠 처음으로</button>
    </div>`;
};

window.clearHistory = async function(){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="modal"><div class="mi">🗑️</div><h2>기록을 모두 지울까요?</h2><p>지금까지의 모든 게임 기록이 사라져요. 되돌릴 수 없어요.</p>
    <button class="mbtn" onclick="confirmClear(this)">네, 지울게요</button>
    <button class="mbtn sec" onclick="this.closest('.overlay').remove()">취소</button></div>`;
  document.body.appendChild(ov);
};
window.confirmClear = function(btn){
  try{ localStorage.removeItem('game-history'); }catch(e){}
  btn.closest('.overlay').remove();
  toast('기록을 지웠어요');
  showHistory();
};

    <p>주가가 0원이 되면 <b>상장폐지</b>(주식이 휴지가 돼요!). 단, 크게 떨어져도 먼저 <b>500원에서 한 번 멈춰요</b>(경고). <b>모든 회사가 같이 떨어지는 사건(예: 경기 침체)으로는 상장폐지되지 않고</b>, 회사 하나만 겨냥한 나쁜 소식이나 깜짝 사건일 때만 0원이 돼요. 상장폐지된 회사 예고는 더 이상 나오지 않아요. 5,500원에 닿으면 거기서 멈춰요. 한 회사는 <b>최대 6주</b>까지만 살 수 있어요.</p>
    <h3>🌈 분산 보너스</h3>
    <p>배당 받을 때 <b>서로 다른 4종류 이상</b> 회사를 가지고 있으면 보너스 용돈을 더 줘요. 골고루 나눠 사면 좋아요!</p>
    <h3>❗ 깜짝 사건</h3>
    <p>가끔 <b>예보에 없던 깜짝 사건</b>이 터져 한 회사가 갑자기 뚝 떨어져요. (중국은 특히 자주!) 그래서 한 곳에 다 걸면 위험해요.</p>
    <h3>🌳 고급 모드</h3>
    <p>고급에서는 <b>예보의 일부가 비공개(❓ 방향 비밀)</b>예요. 회사만 보이고 오를지 내릴지는 숨겨져요. 스스로 잘 판단해야 해요!</p>
    <h3>🎯 비밀 임무 (목표 카드)</h3>
    <p>게임 시작 때 사람마다 <b>비밀 임무</b>를 하나씩 받아요. 남에게 보여주지 말고, 끝에 달성하면 보너스 용돈! (게임 중 🎯 버튼으로 내 임무 확인)</p>
    ${GOALS.map(g=>`<p>${g.ico} <b>${g.nm}</b> — ${g.desc} <b style="color:var(--gold-deep);">+${won(g.reward)}</b></p>`).join('')}
    <h3>🧑‍🏫 투자 도우미</h3>
    <p>도우미를 켜면 예보를 바탕으로 추천👍/주의👎를 이유와 함께 알려줘요. 익숙해지면 끄고 스스로 판단해 보세요.</p>
  `},
  concepts: { title:'📚 주식 개념 (요약)', body:`
    <h3>💰 싸게 사서 비싸게 팔기</h3>
    <p>주식은 회사의 작은 조각이에요. 쌀 때 사두었다 값이 오르면 팔아서 돈을 벌어요.</p>
    <h3>📰 주가는 왜 움직일까</h3>
    <p>좋은 소식(호재)이 있으면 오르고, 나쁜 소식(악재)이 있으면 내려요.</p>
    <h3>🔮 미래는 아무도 모른다 (가장 중요!)</h3>
    <p>게임에선 예보로 앞날을 보지만, <b>진짜 시장에선 아무도 내일을 몰라요.</b> "무조건 오른다"는 말은 믿지 않아요.</p>
    <h3>🌈 계란을 한 바구니에 담지 마라</h3>
    <p>한 회사에 다 걸면 그 회사가 망할 때 전부 잃어요. 여러 회사에 나눠 사는 게 안전해요(분산투자).</p>
    <h3>🛡️ 위험을 다루는 법</h3>
    <p>값이 내릴 때 적당히 파는 걸 손절이라 해요. 자주 사고파는 게 꼭 좋은 건 아니에요.</p>
    <h3>🎁 배당</h3>
    <p>주식을 가지고만 있어도 회사가 나눠주는 돈이에요. 사과나무에서 열리는 사과 같은 거죠.</p>
    <h3>🎯 목표와 시간</h3>
    <p>왜 투자하는지 목표를 정하면 흔들리지 않아요. 그리고 시간이 가장 큰 힘이에요. 천천히 자라요.</p>
    <p style="margin-top:10px;opacity:.7;font-size:12px;">📘 더 자세한 전체 설명은 시작화면의 '게임 설명서(원문)'에서 볼 수 있어요.</p>
  `},
  income: { title:'💰 두 가지 돈 이야기', body:`
    <h3>💪 근로소득 — 일해서 버는 돈</h3>
    <p>몸과 머리로 일하고 받는 돈이에요. 엄마·아빠 월급, 용돈처럼요. 일을 안 하면 안 생겨요.</p>
    <h3>💰 금융소득 — 돈이 벌어주는 돈</h3>
    <p>내가 가진 돈이나 주식이 스스로 벌어다 주는 돈이에요. 이자, 배당금처럼요. 가만히 있어도 들어와요.</p>
    <h3>🍎 사과나무 비유</h3>
    <p>근로소득은 매일 산에 사과를 따러 가는 일(안 가면 못 얻어요). 금융소득은 마당에 심은 사과나무(자는 동안에도 사과가 열려요).</p>
    <h3>🎮 게임과 연결</h3>
    <p>이 게임에서 받는 <b>배당금이 바로 금융소득</b>이에요! 주식을 사두면 가만히 있어도 돈이 들어오죠.</p>
    <h3>⛄ 눈덩이처럼</h3>
    <p>배당으로 받은 돈으로 또 주식을 사면 다음엔 더 많이 받아요. 오래 굴릴수록 커져요. 그래서 일찍 시작하는 게 좋아요.</p>
    <p style="margin-top:10px;opacity:.7;font-size:12px;">📘 더 자세한 전체 설명은 시작화면의 '게임 설명서(원문)'에서 볼 수 있어요.</p>
  `}
};
window.showDoc = function(key){
  const d=DOCS[key];
  $('#app').innerHTML=`<div class="doc-view">
    <div class="doc-hdr"><button class="back-btn" onclick="renderSetup()">← 뒤로</button><h1>${d.title}</h1></div>
    <div class="doc-body">${d.body}</div>
    <button class="start-btn" style="max-width:100%;margin-top:10px;" onclick="renderSetup()">🏠 처음으로</button>
  </div>`;
};

// ---------- 🔐 금고문 시작 화면 ----------
function showVaultIntro(){
  $('#app').innerHTML = `
    <div class="vault-intro" id="vaultIntro">
      <div class="vi-title">🏦 불앤베어 은행</div>
      <div class="vi-sub">꼬마 투자단 · 가족 금융 게임</div>
      <div class="vault-door">
        <span class="vd-spoke h"></span><span class="vd-spoke v"></span>
        <div class="vd-dial"><div class="vd-knob">🔐</div></div>
      </div>
      <button class="vi-btn" onclick="enterVault()">🔐 금고 열기 ▶</button>
      <div class="vi-hint">누르면 금고문이 스르륵 열려요</div>
    </div>`;
}
window.enterVault = function(){
  const intro = document.getElementById('vaultIntro');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!intro || reduce){ renderSetup(); return; }
  intro.classList.add('opening');
  setTimeout(renderSetup, 1000);
};

// ---------- INIT ----------
showVaultIntro();
</script>
</body>
</html>
